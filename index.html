<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Anthracite 1902 — The Coal Strike</title>
<style>
:root{--ink:#221e1a;--paper:#ede2cb;--panel:#f7efdc;--hud:#f4ecda;--cell:#ebdcb9;
 --rust:#7a3426;--dim:#6b5c44;--line:rgba(34,30,26,.32);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0b09;color:var(--ink);font-family:Georgia,'Times New Roman',serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:8px;}
#stage{width:100%;max-width:680px;background:var(--paper);border:4px solid var(--ink);
 box-shadow:0 12px 44px rgba(0,0,0,.75);display:flex;flex-direction:column;
 max-height:97vh;overflow:hidden;position:relative;}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}

header{background:var(--hud);border-bottom:2px solid var(--ink);padding:6px 7px 7px;flex:0 0 auto;}
.mast{display:flex;justify-content:space-between;align-items:center;
 border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:5px;}
.mast b{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--rust);}
.mast span{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:#4a3b2c;}
.voices{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px;}
.vc{background:var(--cell);border:1px solid var(--line);padding:2px 1px 3px;text-align:center;}
.vc .who{font-size:6.6px;font-weight:700;text-transform:uppercase;color:#4a3d2e;
 display:block;line-height:1.15;}
.vc .mood{font-size:9px;margin-top:1px;}
.vc .mood i{font-style:normal;font-size:11px;}
.vc .mood u{text-decoration:none;font-size:6.8px;text-transform:uppercase;display:block;
 font-family:ui-monospace,Menlo,monospace;}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
#strip{margin-top:5px;border:1px solid var(--line);background:#e6dbbe;}
#strip svg{display:block;width:100%;height:auto;}
.smk{animation:smk 3.2s linear infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:.75}
 100%{transform:translate(-5px,-13px) scale(1.5);opacity:0}}
.pick{animation:pick 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes pick{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.dig{animation:dig 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 100%;}
@keyframes dig{0%,100%{transform:rotate(0)}50%{transform:rotate(-11deg)}}
.flowdot{animation:flowd 3.6s linear infinite;}
@keyframes flowd{from{transform:translateX(0);opacity:0}
 8%{opacity:1}88%{opacity:1}to{transform:translateX(150px);opacity:0}}
.chaindot{animation:chaind 4.2s linear infinite;}
@keyframes chaind{from{transform:translateX(0);opacity:0}
 6%{opacity:1}90%{opacity:1}to{transform:translateX(330px);opacity:0}}
.mt{background:#dfcfab;border:1px solid var(--line);padding:2px 1px 3px;text-align:center;}
.mt .who{font-size:6.4px;font-weight:700;text-transform:uppercase;color:var(--rust);
 display:block;line-height:1.1;}
.mt .num{font-size:13px;font-weight:700;font-family:ui-monospace,Menlo,monospace;}
.mt .dl{font-size:7.6px;height:10px;font-family:ui-monospace,Menlo,monospace;color:#8c2f22;}
.mt.up .dl{color:#2f5d34;}

main{flex:0 0 auto;height:216px;background:var(--paper);overflow:hidden;border-bottom:3px solid var(--ink);}
@media(min-width:520px){main{height:262px;}}
main svg{display:block;width:100%;height:100%;}

section{background:var(--panel);padding:9px 11px 12px;flex:1 1 auto;overflow-y:auto;}
.tags{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.tags b{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rust);}
.tags span{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:#7a644e;
 font-family:ui-monospace,Menlo,monospace;}
#say{font-size:13.6px;line-height:1.5;white-space:pre-wrap;}
.hr{border-top:1px solid var(--line);margin:8px 0 7px;}
.gl{border-bottom:2px dotted var(--rust);cursor:pointer;color:#5c3a1e;}
.gl:after{content:'?';font-size:8px;vertical-align:super;color:var(--rust);}
#def{display:none;margin:7px 0 0;padding:7px 9px;background:#e6d9b6;
 border-left:4px solid var(--rust);font-size:12px;line-height:1.42;}
#def b{text-transform:uppercase;letter-spacing:1px;font-size:10px;}

.btn{display:block;width:100%;text-align:left;background:#fffdf8;border:2px solid var(--ink);
 box-shadow:3px 3px 0 var(--ink);padding:8px 10px;margin-bottom:7px;cursor:pointer;font-family:inherit;}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.btn b{display:block;font-size:12.6px;color:var(--rust);margin-bottom:3px;}
.btn i{display:block;font-size:10.6px;color:#594838;line-height:1.34;font-style:normal;}
.btn .pro{color:#3f6b3a;} .btn .con{color:#8c1d15;}
.go{background:var(--rust);color:#fdf6e6;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
 padding:9px 0;width:100%;font-family:inherit;font-size:11px;font-weight:700;
 letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}

.grp{font-size:8.4px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rust);
 margin:7px 0 4px;font-weight:700;}
.terms{display:grid;grid-template-columns:1fr;gap:5px;}
@media(min-width:520px){.terms{grid-template-columns:1fr 1fr;}}
.tm{border:2px solid #382c21;background:#f4ecd8;padding:5px 7px;cursor:pointer;display:flex;gap:6px;}
.tm.on{background:#fcefd6;border-color:var(--rust);box-shadow:2px 2px 0 var(--rust);}
.tm .bx{flex:0 0 12px;height:12px;border:2px solid #382c21;margin-top:2px;background:#fff;
 font-size:9px;line-height:9px;text-align:center;color:var(--rust);font-weight:700;}
.tm b{display:block;font-size:11px;line-height:1.2;}
.tm i{display:block;font-size:9.2px;color:#594d40;line-height:1.28;margin-top:1px;font-style:normal;}

.ask{margin-top:8px;border:2px solid var(--ink);background:#f4ecd8;padding:6px 8px;}
.ask b{display:block;font-size:8.4px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}
.ask .bar{display:block;font-family:ui-monospace,Menlo,monospace;font-size:13px;
 letter-spacing:1px;margin:2px 0 3px;}
.ask i{display:block;font-size:10.6px;line-height:1.35;font-style:italic;}
.ask.thin{background:#f7e0dc;border-color:#a3231a;} .ask.thin .bar,.ask.thin i{color:#8c1d15;}
.ask.fair{background:#e8ecdc;border-color:#5c7a4a;} .ask.fair .bar{color:#3f6b3a;}
.ask.heavy{background:#f7ead3;border-color:#a8641c;} .ask.heavy .bar{color:#8a5115;}
.ask.huge{background:#f7e0dc;border-color:#a3231a;} .ask.huge .bar,.ask.huge i{color:#8c1d15;}
.wsbox{margin-top:8px;border:1px solid var(--line);background:var(--cell);display:flex;}
.wstext{flex:1;padding:6px 8px;}
.wstext b{display:block;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}
.wstext p{font-size:11px;font-style:italic;line-height:1.35;margin-bottom:5px;}
.wstext p:last-child{margin-bottom:0;}
.wsfaces{flex:0 0 92px;border-left:1px solid var(--line);padding:5px 4px;
 display:flex;gap:5px;justify-content:center;background:#e2d3ad;}
.wsface{text-align:center;}
.wsface svg{width:36px;height:36px;border:2px solid var(--ink);background:#f6ecd6;border-radius:50%;}
.wsface span{display:block;font-size:6.6px;text-transform:uppercase;letter-spacing:.4px;
 margin-top:2px;color:#4a3d2e;font-family:ui-monospace,Menlo,monospace;}

#ovl{display:none;position:absolute;inset:10px;z-index:40;background:rgba(244,236,218,.985);
 border:3px solid var(--ink);padding:11px;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.45);}
#ovl .head{display:flex;justify-content:space-between;align-items:baseline;
 border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px;}
#ovl .head b{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rust);}
#ovl .head span{font-size:7.6px;text-transform:uppercase;color:#544331;
 font-family:ui-monospace,Menlo,monospace;}
.card{border:2px solid;padding:6px 7px;margin-bottom:6px;display:flex;gap:8px;
 animation:slam .3s cubic-bezier(.18,.89,.32,1.28) both;}
@keyframes slam{0%{transform:scale(.88) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.card .fc{flex:0 0 44px;}
.card .fc svg{width:44px;height:44px;border:2px solid var(--ink);background:#f6ecd6;border-radius:50%;}
.card .bd{flex:1;}
.card .rw{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:2px;}
.card .nm{font-size:9px;font-weight:700;text-transform:uppercase;line-height:1.15;}
.card .bnd{font-size:9.4px;font-weight:700;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;}
.card q{display:block;font-size:11.4px;font-style:italic;line-height:1.36;quotes:none;}
.card q:before,.card q:after{content:'';}
.f-FURIOUS{background:#f7e0dc;border-color:#a3231a;} .f-FURIOUS .bnd,.f-FURIOUS .nm{color:#8c1d15;}
.f-ANGRY{background:#f7ead3;border-color:#a8641c;} .f-ANGRY .bnd,.f-ANGRY .nm{color:#8a5115;}
.f-COLD{background:#e5e8ea;border-color:#5b6770;} .f-COLD .bnd,.f-COLD .nm{color:#3f4950;}
.f-GRUDGING{background:#e8ecdc;border-color:#5c7a4a;} .f-GRUDGING .bnd,.f-GRUDGING .nm{color:#3f6b3a;}
.f-CHEERING{background:#dff0e5;border-color:#2f7d5c;} .f-CHEERING .bnd,.f-CHEERING .nm{color:#22664a;}
.yell{animation:yell .36s infinite ease-in-out;}
@keyframes yell{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#record{border-top:1px dashed var(--line);margin-top:2px;padding-top:6px;font-size:10.6px;
 line-height:1.42;color:#4a3b2c;}
#record b{font-size:8.4px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}

/* approach-camera walkout */
.apr{animation:apr 9s linear infinite;}
@keyframes apr{
 0%{transform:translateY(126px) scale(.16);opacity:0}
 8%{opacity:1}
 88%{opacity:1}
 100%{transform:translateY(296px) scale(1.45);opacity:0}}
.step1{animation:st .52s steps(1) infinite;}
.step2{animation:st2 .52s steps(1) infinite;}
@keyframes st{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes st2{0%,50%{opacity:0}50.01%,100%{opacity:1}}
.lampglow{animation:lamp 2.6s infinite ease-in-out;}
@keyframes lamp{0%,100%{opacity:.95}35%{opacity:.5}70%{opacity:1}}

/* crowd */
.sp .up{opacity:0;} .sp.cheer .up{opacity:1;} .sp.cheer .dn{opacity:0;}
.sp.cheer .bod{animation:hop .44s infinite alternate ease-in-out;
 transform-box:fill-box;transform-origin:50% 100%;}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.sp.leaveL{animation:outL 2.3s forwards ease-in;}
.sp.leaveR{animation:outR 2.3s forwards ease-in;}
@keyframes outL{0%{transform:translateX(0)}100%{transform:translateX(-230px);opacity:0}}
@keyframes outR{0%{transform:translateX(0)}100%{transform:translateX(230px);opacity:0}}
.sp.leaveL .bod,.sp.leaveR .bod{animation:trudge .4s steps(2) infinite;
 transform-box:fill-box;transform-origin:50% 100%;}
@keyframes trudge{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-2px) rotate(3deg)}}

/* train */
.roll{animation:roll 15s linear infinite;}
@keyframes roll{from{transform:translateX(700px)}to{transform:translateX(-980px)}}
.pf{animation:pf 2.6s linear infinite;transform-box:fill-box;transform-origin:50% 50%;}
@keyframes pf{0%{transform:translate(0,0) scale(.3);opacity:.85}
 100%{transform:translate(16px,-58px) scale(2.2);opacity:0}}
.watch{animation:watch 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.watch:nth-of-type(2n){animation-delay:-1.7s;}
.watch:nth-of-type(3n){animation-delay:-3.1s;}
@keyframes watch{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}

/* pump */
.wcyc{animation:wcyc 6.5s infinite cubic-bezier(.45,0,.55,1);}
@keyframes wcyc{0%{transform:translateY(0)}50%{transform:translateY(-27px)}
 70%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.wflood{animation:wflood 5.4s forwards cubic-bezier(.3,0,.4,1);}
@keyframes wflood{0%{transform:translateY(0)}100%{transform:translateY(-134px)}}
.piston{animation:pist 1.05s infinite ease-in-out;}
@keyframes pist{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.beam{animation:beam 1.05s infinite ease-in-out;transform-box:fill-box;transform-origin:14% 50%;}
@keyframes beam{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.disch{stroke-dasharray:7 6;animation:dis .5s infinite linear,dgate 6.5s infinite;}
@keyframes dis{to{stroke-dashoffset:-13}}
@keyframes dgate{0%,44%{opacity:.1}52%,72%{opacity:1}80%,100%{opacity:.1}}
.seep{stroke-dasharray:4 5;animation:seep 1.6s infinite linear;}
@keyframes seep{to{stroke-dashoffset:-9}}
.tmbL,.tmbR{transform-box:fill-box;transform-origin:50% 0;}
.flood .tmbL{animation:crush 5.4s forwards ease-in;}
.flood .tmbR{animation:crush 5.4s .3s forwards ease-in;}
@keyframes crush{0%,60%{transform:rotate(0)}100%{transform:rotate(12deg)}}
.flood .piston,.flood .beam{animation:none;}
.flood .disch{opacity:0;animation:none;}
.stopped{display:none;} .flood .stopped{display:block;}
.flood .runlbl{display:none;}


/* ── Act II additions ── */
.go:disabled{opacity:.42;box-shadow:none;}
/* relief ledger */
.led{border:2px solid var(--ink);background:#f4ecd8;}
.ledhead{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;
 background:var(--cell);border-bottom:1px solid var(--line);}
.ledhead b{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rust);}
.ledhead span{font-size:11px;font-family:ui-monospace,Menlo,monospace;font-weight:700;}
.row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px dotted var(--line);}
.row:last-child{border-bottom:none;}
.row .nm{flex:1;}
.row .nm b{display:block;font-size:11px;}
.row .nm i{display:block;font-size:9.2px;color:#594d40;font-style:normal;line-height:1.25;}
.row .pips{flex:0 0 66px;letter-spacing:1px;font-size:12px;color:var(--rust);
 font-family:ui-monospace,Menlo,monospace;}
.row button{width:22px;height:22px;border:2px solid var(--ink);background:#fffdf8;
 font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1;}
.row button:active{transform:translate(1px,1px);}
.row button:disabled{opacity:.3;}

.rainA{stroke-dasharray:7 20;animation:rainf .42s linear infinite;}
.rainB{stroke-dasharray:5 26;animation:rainf .3s linear infinite;}
@keyframes rainf{to{stroke-dashoffset:-27}}
.patrol{animation:patrol 17s linear infinite;}
@keyframes patrol{from{transform:translateX(-210px)}to{transform:translateX(760px)}}
.hoof{animation:hoof .58s infinite alternate ease-in-out;
 transform-box:fill-box;transform-origin:50% 100%;}
@keyframes hoof{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.shiver{animation:shiver .9s infinite ease-in-out;}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.4px)}}
.turn{animation:turn 1.4s forwards ease-in;}
@keyframes turn{to{transform:translateX(-46px);opacity:0}}
.hold{animation:hold 3.2s infinite ease-in-out;transform-box:fill-box;transform-origin:50% 100%;}
.hold:nth-of-type(2n){animation-delay:-1.3s;}
@keyframes hold{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.march{animation:march 22s linear infinite;}
@keyframes march{from{transform:translateX(700px)}to{transform:translateX(-760px)}}
.pace{animation:pace 9s ease-in-out infinite alternate;}
@keyframes pace{from{transform:translateX(0)}to{transform:translateX(190px)}}
.flick{animation:flick 1.9s steps(3) infinite;}
@keyframes flick{0%,86%{opacity:1}90%{opacity:.45}96%{opacity:1}}
.arc{animation:arc 2.6s ease-in infinite;}
@keyframes arc{0%{transform:translate(0,0);opacity:0}12%{opacity:1}
 100%{transform:translate(210px,-46px);opacity:0}}
.rain{animation:rain 1.1s linear infinite;}
@keyframes rain{to{transform:translateY(26px)}}

/* ── Act III additions ── */
.mt.warn{background:#e8c2a8;border-color:#8c2f22;}
/* the conference */
.offer{border:2px solid var(--ink);background:#f4ecd8;padding:8px 10px;margin-bottom:9px;
 display:flex;gap:10px;box-shadow:3px 3px 0 var(--ink);}
.offer .fc{flex:0 0 52px;}
.offer .fc svg{width:52px;height:52px;border:2px solid var(--ink);background:#f6ecd6;border-radius:50%;}
.offer .nm{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--rust);}
.offer .sub{font-size:8.4px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;}
.offer q{display:block;font-size:13px;font-style:italic;line-height:1.42;margin-top:4px;quotes:none;}
.offer q:before,.offer q:after{content:'';}
.tone{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
 background:#fffdf8;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
 padding:8px 10px;margin-bottom:7px;cursor:pointer;font-family:inherit;}
.tone:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.tone .hd{flex:0 0 40px;}
.tone .hd svg{width:40px;height:40px;border:2px solid var(--ink);background:#f6ecd6;border-radius:50%;}
.tone .hd span{display:block;text-align:center;font-size:6.6px;letter-spacing:.6px;
 text-transform:uppercase;margin-top:2px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;}
.tone .tx{flex:1;}
.tone .tx q{display:block;font-size:12.4px;font-style:italic;line-height:1.38;quotes:none;}
.tone .tx q:before,.tone .tx q:after{content:'';}
.tone .tx em{display:block;font-size:10px;font-style:normal;margin-top:4px;}
.tone .up{color:#3f6b3a;} .tone .dn{color:#8c1d15;}
.prov{border:2px solid #5b6770;background:#e5e8ea;padding:8px 10px;margin-bottom:8px;}
.prov .nm{font-size:9px;font-weight:700;text-transform:uppercase;color:#3f4950;letter-spacing:1px;}
.prov q{display:block;font-size:13.4px;font-style:italic;line-height:1.4;margin-top:3px;quotes:none;}
.prov q:before,.prov q:after{content:'';}
.cost{border:2px solid var(--ink);background:#f4ecd8;padding:6px 9px;margin-bottom:8px;
 display:flex;justify-content:space-between;align-items:center;gap:8px;}
.cost b{font-size:8.4px;letter-spacing:1.4px;text-transform:uppercase;color:var(--rust);}
.cost span{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;}
.cost.hot{background:#f7e0dc;border-color:#a3231a;} .cost.hot span{color:#8c1d15;}
.ledger{border-top:1px dashed var(--line);margin-top:7px;padding-top:6px;font-size:10.6px;
 line-height:1.4;color:#4a3b2c;}
.ledger b{color:var(--rust);}

.sleet{stroke-dasharray:4 16;animation:sleetf .38s linear infinite;}
@keyframes sleetf{to{stroke-dashoffset:-20}}
.huddle{animation:huddle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.huddle:nth-of-type(2n){animation-delay:-1.1s;}
@keyframes huddle{0%,100%{transform:translateX(0)}50%{transform:translateX(1.3px)}}
.lamplit{animation:lamplit 3.4s ease-in-out infinite;}
@keyframes lamplit{0%,100%{opacity:.9}45%{opacity:.62}}
.wave{animation:wave 5.5s ease-in-out infinite;}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-3px) rotate(.5deg)}}
.spk{transition:opacity .35s;}
.pt .hd{transform-box:fill-box;transform-origin:50% 94%;animation:psway 4.4s ease-in-out infinite;}
@keyframes psway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.1deg) translateY(-5px)}}
.pt .quiet .mo{animation:none;transform:scaleY(.28);}
.pt .mo{transform-box:fill-box;transform-origin:50% 0%;animation:pchew .52s ease-in-out infinite;}
@keyframes pchew{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
.pt .lid{animation:plid 5.6s steps(1) infinite;}
@keyframes plid{0%,95%{opacity:0}96%,98%{opacity:1}99%,100%{opacity:0}}
.pt .brw{transform-box:fill-box;transform-origin:50% 100%;animation:pbrow 4.4s ease-in-out infinite;}
@keyframes pbrow{0%,58%,100%{transform:translateY(0)}66%,84%{transform:translateY(-6px)}}

/* ── Act IV additions ── */
/* witness list */
.wcount{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;
 background:var(--cell);border:2px solid var(--ink);margin-bottom:7px;}
.wcount b{font-size:8.6px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rust);}
.wcount span{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;}
.wit{border:2px solid #382c21;background:#f4ecd8;padding:6px 8px;margin-bottom:6px;
 display:flex;gap:8px;cursor:pointer;}
.wit.on{background:#fcefd6;border-color:var(--rust);box-shadow:2px 2px 0 var(--rust);}
.wit.off{opacity:.5;}
.wit .bx{flex:0 0 13px;height:13px;border:2px solid #382c21;background:#fff;margin-top:2px;
 font-size:10px;line-height:10px;text-align:center;color:var(--rust);font-weight:700;}
.wit .nm{font-size:11.4px;font-weight:700;display:block;}
.wit .rl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:block;}
.wit .ln{font-size:10.4px;font-style:italic;line-height:1.32;margin-top:3px;display:block;}
.wit .tags{display:block;margin-top:3px;}
.wit .sy{display:block;margin:5px 0 1px;border-left:2px solid var(--rust);padding-left:8px;}
.wit .sy>span{display:block;font-size:10.4px;font-style:italic;line-height:1.36;
 color:#4a3d2e;margin-bottom:4px;}
.wit .sy>span:last-child{margin-bottom:0;}
.wit .sy .gl{display:inline;font-style:italic;}
.tg{display:inline-block;font-size:7.6px;letter-spacing:.6px;text-transform:uppercase;
 border:1px solid #8a7a5c;padding:1px 4px;margin:2px 3px 0 0;color:#5c4a33;}
.tg.risk{border-color:#a3231a;color:#8c1d15;}
/* findings board */
.find{border:2px solid var(--ink);background:#f4ecd8;padding:7px 9px;margin-bottom:8px;}
.find b{display:block;font-size:8.6px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rust);
 margin-bottom:5px;}
.fr{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.fr .fl{flex:0 0 96px;font-size:9.6px;text-transform:uppercase;letter-spacing:.4px;}
.fr .bar{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.5px;color:#3f6b3a;}
.fr .st{flex:0 0 78px;text-align:right;font-size:9px;font-family:ui-monospace,Menlo,monospace;}
.fr.no .bar{color:#8c1d15;} .fr.no .st{color:#8c1d15;}
/* award */
.doc{background:#fffdf3;border:3px double var(--ink);padding:12px 14px;}
.doc h4{text-align:center;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;
 color:var(--rust);margin-bottom:2px;}
.doc .dt{text-align:center;font-size:8.6px;letter-spacing:1.4px;color:var(--dim);margin-bottom:9px;}
.doc .it{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line);}
.doc .it:last-child{border-bottom:none;}
.doc .it .k{flex:1;font-size:11.6px;}
.doc .it .v{flex:0 0 108px;text-align:right;font-size:9.6px;font-weight:700;
 font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;}
.v.yes{color:#2f6b3a;} .v.part{color:#8a5115;} .v.no{color:#8c1d15;}

.away{animation:away 11s linear infinite;}
@keyframes away{0%{transform:translateY(296px) scale(1.4);opacity:0}
 8%{opacity:1}82%{opacity:1}100%{transform:translateY(134px) scale(.26);opacity:0}}
.wave2{animation:wave2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
.wave2:nth-of-type(2n){animation-delay:-2s;} .wave2:nth-of-type(3n){animation-delay:-4s;}
@keyframes wave2{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){
 .apr,.step1,.step2,.lampglow,.sp.cheer .bod,.roll,.watch,.wcyc,.wflood,
 .piston,.beam,.disch,.seep,.yell,.smk,.pick,.dig,.flowdot,
 .hold,.march,.pace,.flick,.arc,.rain,.rainA,.rainB,.patrol,.hoof,.shiver,
 .sleet,.huddle,.lamplit,.wave,.away,.wave2{animation:none}
 .pt .hd,.pt .mo,.pt .lid,.pt .brw{animation:none}
 .sp.leaveL,.sp.leaveR{animation:none;opacity:.22}
 .turn{animation:none;opacity:.2}}
</style>
</head>

<body>
<div id="stage">
  <header>
    <div class="mast"><b id="mast">The Coal Strike Chronicle · 1902</b><span id="actTag">Act I</span></div>
    <div class="voices" id="voices"></div>
    <div class="meters" id="meters"></div>
    <div id="strip"></div>
  </header>
  <main id="art"></main>
  <section>
    <div class="tags"><b id="who"></b><span id="stat"></span></div>
    <div id="say"></div>
    <div id="def"></div>
    <div class="hr"></div>
    <div id="ui"></div>
  </section>
  <div id="ovl">
    <div class="head"><b>Incoming reactions</b><span>angriest first ↓</span></div>
    <div id="cards"></div><div id="record"></div>
    <button class="go" style="margin-top:9px" onclick="dismiss()">Endure it &amp; continue →</button>
  </div>
</div>

<script>
/* ═══ GLOSSARY ═══ (Act I and Act II merged; Act I's wording wins on shared keys) */
const GLOSS={
 ton:"2,000 pounds, usually. The coal companies used a 'long ton' of 2,240 pounds or more and still called it one ton.",
 anthracite:"Hard coal. Burns hot with almost no smoke, so it was what heated houses. In America it came from five counties in Pennsylvania and nowhere else.",
 checkweighman:"A worker the miners pay themselves to watch the company scale. Most companies refused to allow one.",
 docking:"When a boss decided part of your coal car was rock and took that much off your pay. He decided. You could not argue.",
 recognition:"When a company officially agrees to deal with the union. Companies fought this harder than they fought over money.",
 union:"A group of workers who bargain together instead of one at a time. One worker can be fired. Ten thousand cannot.",
 bituminous:"Soft coal. Different mines, different states. Your union signed contracts there. Factories and trains burn it. It does not work in a house stove.",
 companystore:"A store owned by the mine, often the only one in town. You bought tools and powder there on credit, at their price.",
 sump:"The low point of a mine where water collects so a pump can lift it out.",
 timber:"Wooden posts and beams holding the tunnel roof up. Waterlogged timber gives way.",
 colliery:"A whole mine site — shaft, buildings, machines, all of it.",
 tentcolony:"Canvas camps put up on land the union rented, so evicted families had somewhere to go. They cost the strike fund money that would otherwise have bought food.",
 coalandiron:"The Coal and Iron Police. Private officers paid by the mine companies but given real police powers by the state of Pennsylvania. They answered to the company, not to a town.",
 local:"One branch of the union in one town. The UMW had hundreds, and each ran its own meetings.",
 mollies:"The Molly Maguires — Irish miners hanged in the 1870s after trials built largely on a Pinkerton detective's testimony. Twenty-five years later, operators still used the name to make any Irish or Slavic miner sound like a murderer.",
 militia:"The Pennsylvania National Guard. Citizen soldiers called out by the governor. In 1902 he eventually sent the entire division into the coal fields.",
 blacklist:"A list of men the companies agreed among themselves never to hire again. Being on it meant leaving the region for good.",
 eviction:"Removal from your house. Most miners rented from the company that employed them, so losing the strike and losing the roof were the same event.",
 relief:"Food and rent money paid out to strikers' families, funded here by soft coal miners in other states who were still working.",
 pinkerton:"A private detective agency hired by companies to infiltrate unions and report what was said in closed meetings.",
 injunction:"A court order telling people to stop. Break one and you go to jail with no trial by jury. This is how the 1894 Pullman strike was broken and how its leader went to prison.",
 arbitration:"When both sides let an outside board decide, and promise ahead of time to accept the answer.",
 ncf:"The National Civic Federation. A group of businessmen, politicians and union leaders who tried to settle strikes in private. Mark Hanna, the Republican boss, ran it.",
 receivership:"When the government takes over a private business and runs it. Roosevelt planned to do this to the mines using the army. Almost nobody thought a president was allowed to.",
 commission:"The seven men Roosevelt appointed to decide the case. A judge, an army engineer, a mine expert, a businessman, a bishop, a union man, and a government official.",
 testimony:"What a witness says under oath. It is written down word for word and kept forever.",
 crossexam:"When the other side's lawyer questions your witness, trying to make the story fall apart.",
 conciliation:"A board where both sides bring problems as they come up. Less than a contract. More than nothing.",
 award:"The commission's final decision. Both sides promised in advance to accept it, whatever it said.",
 breakerboy:"A boy who picks rock out of coal by hand as it slides down a chute. Some were eight years old."};
const GLOSS_NAME={checkweighman:'check-weighman',companystore:'company store',
 coalandiron:'Coal and Iron Police',mollies:'Molly Maguires',pinkerton:'Pinkerton detective',
 tentcolony:'tent colony',ncf:'National Civic Federation',
 crossexam:'cross-examination',breakerboy:'breaker boy'};
const parse=s=>s.replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(m,k,d)=>`<span class="gl" data-k="${k}">${d}</span>`)
                .replace(/\[\[(\w+)\]\]/g,(m,k)=>`<span class="gl" data-k="${k}">${k}</span>`);
const md=s=>parse(String(s).replace(/\\n/g,'\n')).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                    .replace(/\*([^*]+)\*/g,'<em>$1</em>');

/* ═══ STATE ═══ one object for all three acts; Acts II and III have no
   initializer of their own. SPLIT is only moved by Act II; hot and wry only by
   Act III's conference. COALF is the fractional coal Act III's tickCoal drives.
   warms0 marks the I/II boundary so Act II's "cheered by his own" ending still
   measures applause earned in Act II. */
const S={FIELD:78,FUND:19,COUNTRY:42,STANDING:50,MINES:100,SPLIT:0,act:1,
 COAL:8,COALF:8,DEMAND:2.2,PRE:false,
 rel:{cm:3,lb:-3,pr:0,ho:0},warms:0,warms0:0,hot:0,wry:0,flags:{},
 mood:{cm:'GRUDGING',lb:'ANGRY',op:'COLD',pr:'COLD',ho:'COLD'}};
let prev={...S};
const BAND={FURIOUS:{r:1,e:'😡',t:'Furious'},ANGRY:{r:2,e:'😠',t:'Angry'},
 COLD:{r:3,e:'🧊',t:'Cold'},GRUDGING:{r:4,e:'😐',t:'Grudging'},CHEERING:{r:5,e:'🎉',t:'Cheering'}};
const VOICE={cm:['Contract men','Welsh &amp; Irish skilled miners'],
 lb:['Laborers','Slavic &amp; Italian day men'],
 op:['Coal barons','The six railroads'],
 pr:['The press','Editors in New York &amp; Philadelphia'],
 ho:['Households','People who must buy coal in December']};
const ORDER=['cm','lb','op','pr','ho'];
const METERS=[['FIELD','Men out',v=>v+'%'],['FUND','Food wks',v=>v],
 ['COUNTRY','Public',v=>v],['STANDING','Your name',v=>v],['MINES','Mines ok',v=>v+'%']];
const bandOf=n=>n>=6?'CHEERING':n>=3?'GRUDGING':n>=0?'COLD':n>=-3?'ANGRY':'FURIOUS';
// Your own men are harder to please than editors are. Grudging is the usual ceiling.
const REL_D={FURIOUS:-5,ANGRY:-2,COLD:0,GRUDGING:2,CHEERING:4};
const relBand=n=>n>=8?'CHEERING':n>=3?'GRUDGING':n>=-2?'COLD':n>=-8?'ANGRY':'FURIOUS';
const bandMen=n=>n>=9?'CHEERING':n>=4?'GRUDGING':n>=0?'COLD':n>=-4?'ANGRY':'FURIOUS';

/* ═══ STRIKE STATUS STRIP & HUD ═══ Act III's, with the pre-strike branch restored */
function picketFig(x,c){
  return `<g transform="translate(${x},74)"><g class="pick">
   <rect x="-3.2" y="-11" width="2.7" height="11" fill="${c}"/>
   <rect x="0.5" y="-11" width="2.7" height="11" fill="${c}"/>
   <path d="M-3.6,-11 L-3.1,-24 L3.1,-24 L3.6,-11 Z" fill="${c}"/>
   <circle cx="0" cy="-27.4" r="2.9" fill="#c9ad8b"/>
   <path d="M-3.3,-29 C-3.3,-32.2 3.3,-32.2 3.3,-29 L4.8,-28.4 L-3.8,-28.4 Z" fill="${c}"/>
   <path d="M3.1,-22.5 L7.4,-33 L5.6,-33.8 L1.6,-24 Z" fill="${c}"/>
   <rect x="6.2" y="-46" width="1.7" height="15" fill="#6b5537"/>
   <rect x="1.4" y="-53" width="13.4" height="8" rx="1" fill="#f2e8d3" stroke="#14110e" stroke-width=".8"/>
  </g></g>`;
}
function digFig(x,c){
  return `<g transform="translate(${x},74)">
   <rect x="-4.4" y="-10" width="2.7" height="10" fill="${c}"/>
   <rect x="0.4" y="-10" width="2.7" height="10" fill="${c}"/>
   <path d="M-5,-10 L-2.4,-21 L4.6,-19.6 L3,-9.4 Z" fill="${c}"/>
   <circle cx="6.6" cy="-22.6" r="2.8" fill="#c9ad8b"/>
   <path d="M3.6,-24.4 C3.8,-27.4 10,-26.6 9.6,-23.6 L11,-23 L3,-23.8 Z" fill="${c}"/>
   <g class="dig"><rect x="-1" y="-20" width="15" height="1.7" transform="rotate(26 -1 -20)" fill="#6b5537"/>
    <path d="M11.6,-8.6 L17.4,-6.2 L15.6,-1.6 L10,-4.2 Z" fill="#8d949a" stroke="#14110e" stroke-width=".7"/></g>
  </g>`;
}
function houseFig(x,lit){
  return `<g transform="translate(${x},74)">
   <polygon points="-9.5,0 -9.5,-9 0,-16.5 9.5,-9 9.5,0"
     fill="${lit?'#e2d5b2':'#b0a892'}" stroke="#14110e" stroke-width="1"/>
   <rect x="-2.6" y="-6.4" width="5.2" height="6.4" fill="${lit?'#5a4a36':'#8a8272'}"/>
   <rect x="3.8" y="-17.6" width="3.6" height="7.6" fill="${lit?'#7a6a52':'#9a9282'}" stroke="#14110e" stroke-width=".8"/>
   ${lit?`<g fill="#8f9aa2"><g class="smk"><circle cx="5.6" cy="-20" r="2.4"/></g>
    <g class="smk" style="animation-delay:-1.1s"><circle cx="5.6" cy="-20" r="2.4"/></g></g>`:''}</g>`;
}
// Act I's five-tier version: Act III's covers only COAL 2..0, and Acts I-II open at 8.
function coalNote(c,pre){
  if(pre) return 'Every stove in the East burns this. Nobody thinks about it at all.';
  if(S.act===4) return 'The cities are warm. Nobody is angry any more. Nobody is listening either.';
  return c>=8 ? 'The cities are not cold yet. Outside this valley nobody has noticed you.'
   : c>=6 ? 'Coal is getting dear in the East. Editors have begun to ask who is to blame.'
   : c>=4 ? 'Schools are closing for want of heat. People are pulling coal off rail cars.'
   : c>=2 ? 'The cities are freezing. This is the first week anyone in Washington read your name.'
   : 'There is no coal. What happens now happens because of that, not because of you.';
}
function causeNote(working,N,lit,pre){
  if(pre)        return `All ${N} are digging and every house is warm. This is the machine running.`;
  if(S.act===4)  return `${working} of ${N} men are back at work. The machine has started again without you.`;
  // Warm cities in Acts I-II come off the pile, not out of the ground: only claim the
  // line has broken when this month's digging actually covers demand.
  if(lit>=6)     return production()*3 >= S.DEMAND
    ? `${working} of ${N} men are back at work. Coal is flowing again — and so is your power, away from you.`
    : `The cities are burning what was stockpiled before May, not what is being dug now.`;
  if(working<=1) return `Almost nobody is digging. That is why only ${lit} house${lit===1?'':'s'} ${lit===1?'is':'are'} warm.`;
  return `${working} of ${N} men are digging. It is not enough to keep the cities warm.`;
}
// Both notes share a 280px column beside the soft-coal block; shrink rather than collide.
const fitNote=(t,px)=>Math.min(px, 280/(t.length*0.455));
function drawStrip(){
  const el=document.getElementById('strip'); if(!el) return;
  const pre=!!S.PRE, N=12;
  const out=pre?0:Math.round(N*S.FIELD/100), working=N-out;
  const H=8, lit=pre?H:Math.max(0,Math.min(H,S.COAL));
  let men=''; for(let i=0;i<N;i++) men += i<out?picketFig(20+i*22.5,'#3a322a'):digFig(20+i*22.5,'#6e675c');
  let houses=''; for(let i=0;i<H;i++) houses += houseFig(492+i*21, i<lit);
  const nd=pre?9:Math.max(0,Math.round(production()*9));
  let dots=''; for(let i=0;i<nd;i++) dots += `<g transform="translate(300,58)"><g class="flowdot"
    style="animation-delay:-${(i*3.6/nd).toFixed(2)}s"><circle r="3" fill="#241f1a"/></g></g>`;
  const fl = pre?'FULL':nd===0?'NOTHING MOVING':nd<=3?'A TRICKLE':'STILL MOVING';
  const dC = pre?0:lit - prevCoal;
  const cause=causeNote(working,N,lit,pre), note=coalNote(lit,pre);
  el.innerHTML=`<svg viewBox="0 0 660 108" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif">
   <rect width="660" height="108" fill="#e6dbbe"/>
   <text x="12" y="14" font-size="8.6" letter-spacing="1.3" fill="#7a3426">
    THE FIELDS · ${pre?'ALL 12 AT WORK':out+' OF '+N+' STILL OUT'}</text>${men}
   <line x1="292" y1="6" x2="292" y2="84" stroke="#c3b494" stroke-width="1"/>
   <text x="300" y="14" font-size="8.6" letter-spacing="1.3" fill="#7a3426">COAL · ${fl}</text>
   <line x1="300" y1="58" x2="452" y2="58" stroke="#c3b494" stroke-width="1" stroke-dasharray="3 4"/>
   <polygon points="456,58 448,54 448,62" fill="#c3b494"/>${dots}
   ${nd===0?`<text x="376" y="46" text-anchor="middle" font-size="9" font-style="italic" fill="#8c2f22">nothing is coming out</text>`:''}
   <g opacity=".5">${digFig(310,'#a09884')}${digFig(336,'#a09884')}${digFig(362,'#a09884')}</g>
   <text x="300" y="94" font-size="7.4" fill="#6b5c44">🔒 soft coal: 300,000 at work, not yours —</text>
   <text x="300" y="103" font-size="7.4" fill="#6b5c44">and it will not burn in a house stove.</text>
   <line x1="472" y1="6" x2="472" y2="84" stroke="#c3b494" stroke-width="1"/>
   <text x="480" y="14" font-size="8.6" letter-spacing="1.3" fill="#7a3426">
    THE CITIES · ${lit} OF ${H} WARM</text>${houses}
   ${dC?`<text x="640" y="14" text-anchor="end" font-size="9" font-weight="700"
     fill="${dC>0?'#2f5d34':'#8c2f22'}">${dC>0?'▲'+dC:'▼'+Math.abs(dC)}</text>`:''}
   <text x="12" y="90" font-size="${fitNote(cause,7.4).toFixed(2)}" font-weight="700" fill="#5c3a1e">${cause}</text>
   <text x="12" y="101" font-size="${fitNote(note,7.4).toFixed(2)}" font-style="italic" fill="#6b5c44">${note}</text></svg>`;
}
// Scabs cannot run a colliery. Real output only starts once the line has largely broken.
function production(){ return Math.max(0,(100-S.FIELD)/100 - 0.20) * 1.9; }
let prevCoal = 8;
// Acts I and II script the coal per beat; Act III lets production and demand decide it.
function setCoal(v){ prevCoal=S.COAL; S.COALF=v; S.COAL=v; }
function tickCoal(){
  prevCoal = S.COAL;
  S.COALF = Math.max(0, Math.min(8, S.COALF + production()*3 - S.DEMAND));
  S.COAL = Math.round(S.COALF);
}
function hud(){
  document.getElementById('voices').innerHTML=ORDER.map(k=>{const b=BAND[S.mood[k]];
   return `<div class="vc"><span class="who">${VOICE[k][0]}${k==='op'?' 🔒':''}</span>
    <span class="mood"><i>${b.e}</i><u>${b.t}</u></span></div>`;}).join('');
  document.getElementById('meters').innerHTML=METERS.map(([k,l,f])=>{
   const d=S[k]-prev[k],a=d===0?'':(d>0?'▲'+d:'▼'+Math.abs(d));
   // In Act IV the men are back by design, so an empty field is no longer a warning.
   const warn=(k==='FUND'&&S.FUND<=4)||(k==='FIELD'&&S.FIELD<40&&S.act<4)||(k==='STANDING'&&S.STANDING<32);
   return `<div class="mt ${d>0?'up':''} ${warn?'warn':''}"><span class="who">${l}</span>
    <div class="num">${f(S[k])}</div><div class="dl">${a}</div></div>`;}).join('');
  drawStrip();
}

/* ═══ THE MACHINE, BEFORE THE STRIKE ═══ */
function scChain(){
  let dots='';
  for(let i=0;i<11;i++) dots += `<g transform="translate(196,196)"><g class="chaindot"
    style="animation-delay:-${(i*4.2/11).toFixed(2)}s"><circle r="5" fill="#191510"/></g></g>`;
  let diggers='';
  [40,74,108,142].forEach((x,i)=>{ diggers += digFig2(x,214,1.5+((i%2)*.12)); });
  let houses='';
  for(let i=0;i<7;i++) houses += `<g transform="translate(${548+ (i%4)*32},${i<4?196:250}) scale(1.5)">
    <polygon points="-9.5,0 -9.5,-9 0,-16.5 9.5,-9 9.5,0" fill="#e2d5b2" stroke="#14110e" stroke-width="1.1"/>
    <rect x="-2.6" y="-6.4" width="5.2" height="6.4" fill="#5a4a36"/>
    <rect x="3.8" y="-17.6" width="3.6" height="7.6" fill="#7a6a52" stroke="#14110e" stroke-width=".8"/>
    <g fill="#8f9aa2"><g class="smk"><circle cx="5.6" cy="-20" r="2.4"/></g>
     <g class="smk" style="animation-delay:-1.1s"><circle cx="5.6" cy="-20" r="2.4"/></g>
     <g class="smk" style="animation-delay:-2.2s"><circle cx="5.6" cy="-20" r="2.4"/></g></g></g>`;
  return wrap(`
  <rect width="660" height="300" fill="url(#pg)"/>
  <rect x="0" y="0" width="660" height="150" fill="url(#hl)" opacity=".3"/>
  <path d="M0,150 L96,60 L200,150 Z" fill="#241f1a"/>
  <path d="M22,150 L22,104 C22,80 74,80 74,104 L74,150 Z" fill="#0a0806"/>
  <path d="M22,106 C22,80 74,80 74,106" fill="none" stroke="#14110e" stroke-width="4"/>
  <path d="M214,150 L214,54 L244,54 L244,30 L330,30 L330,150 Z" fill="#2c2722" stroke="#14110e" stroke-width="2.4"/>
  <g fill="#f2e8d3" stroke="#14110e" stroke-width="1.4">
   <rect x="256" y="52" width="16" height="20"/><rect x="284" y="52" width="16" height="20"/>
   <rect x="256" y="88" width="16" height="20"/><rect x="284" y="88" width="16" height="20"/></g>
  <line x1="0" y1="150" x2="660" y2="150" stroke="#14110e" stroke-width="3"/>
  <rect x="0" y="150" width="660" height="150" fill="#cdbb96"/>
  <line x1="196" y1="196" x2="530" y2="196" stroke="#8d7f63" stroke-width="3" stroke-dasharray="5 6"/>
  <polygon points="534,196 524,190 524,202" fill="#8d7f63"/>

 you:{rx:36,ry:43,cy:54,skin:'#e8c199'},hanna:{rx:41,ry:44,cy:53,skin:'#f2e0c4'}};

   ? `<path d="M${50-F.rx+7},${F.cy-19} L42,${F.cy-15}" stroke="#2a1a0c" stroke-width="6"

   : `<path d="M${50-F.rx+7},${browY} L42,${browY+tilt} M${50+F.rx-7},${browY} L58,${browY+tilt}"
   stroke="#2a1a0c" stroke-width="6" fill="none" stroke-linecap="round"/>`;

      fill="#c0392b" opacity="${(0.5*h).toFixed(2)}"/>

   extra=`<path d="M38,${mY-9} C44,${mY-13} 56,${mY-13} 62,${mY-9} L60,${mY-3}

/* Union of Act II's and Act III's figure: Act II needs kepi and none,
   Act III needs derby, bald, specs and stache. */
function fig(o){
  const d=o.dark||'#241f1a', s=o.s||1, hat=o.hat||'flat';
  const cap = hat==='flat'?`<path d="M-7,-40 C-7,-46 7,-46 7,-40 L10.4,-38.6 L-7.6,-38.6 Z" fill="${d}"/>`
   : hat==='round'?`<path d="M-6.6,-39.6 C-6.6,-47 6.6,-47 6.6,-39.6 Z" fill="${d}"/>
      <rect x="-7" y="-40.2" width="14" height="2" fill="${d}"/>`
   : hat==='shawl'?`<path d="M-9,-40 C-9,-50 9,-50 9,-40 C9,-30 6,-22 0,-20 C-6,-22 -9,-30 -9,-40 Z" fill="#7d4a3a"/>`
   : hat==='kepi'?`<path d="M-7.4,-40 C-7.4,-47 7.4,-47 7.4,-40 Z" fill="#2f3a2c"/>
      <rect x="-8.4" y="-40.6" width="16.8" height="2.4" fill="#1d241b"/>`
   : hat==='derby'?`<path d="M-7.4,-40 C-7.4,-48 7.4,-48 7.4,-40 Z" fill="#1a1a1e"/>
      <ellipse cx="0" cy="-39.6" rx="10.6" ry="2.2" fill="#1a1a1e"/>`
   : hat==='bald'?`<path d="M-6.8,-40 C-6.8,-44 -4,-46 -2,-46" fill="none" stroke="#8d8578" stroke-width="2"/>
      <path d="M6.8,-40 C6.8,-44 4,-46 2,-46" fill="none" stroke="#8d8578" stroke-width="2"/>`
   : hat==='none'?`<path d="M-6.6,-39.6 C-6.6,-46 6.6,-46 6.6,-39.6 Z" fill="#3a2c1c"/>` : '';
  return `<g transform="translate(${o.x},${o.y}) scale(${s})" class="${o.cls||''}">
   <rect x="-7" y="-11" width="5.6" height="11" fill="${d}"/>
   <rect x="1.4" y="-11" width="5.6" height="11" fill="${d}"/>
   <path d="M-7.6,-11 L-6.4,-31 L6.4,-31 L7.6,-11 Z" fill="${d}"/>
   ${o.arms==='up'?`<path d="M-6.4,-29 L-12,-42 L-9.6,-44 L-3.6,-31 Z" fill="${d}"/>
      <path d="M6.4,-29 L12,-42 L9.6,-44 L3.6,-31 Z" fill="${d}"/>`
    :`<path d="M-6.4,-29 L-11,-13 L-8.4,-12 L-3.6,-26 Z" fill="${d}"/>
      <path d="M6.4,-29 L11,-13 L8.4,-12 L3.6,-26 Z" fill="${d}"/>`}
   <circle cx="0" cy="-37" r="6" fill="${o.skin||'#c9ad8b'}" stroke="#14110e" stroke-width="1"/>
   ${cap}${o.specs?`<circle cx="-2.6" cy="-37.4" r="2.8" fill="none" stroke="#2b2620" stroke-width="1"/>
     <circle cx="2.6" cy="-37.4" r="2.8" fill="none" stroke="#2b2620" stroke-width="1"/>
     <line x1="-.2" y1="-37.4" x2=".2" y2="-37.4" stroke="#2b2620" stroke-width="1"/>`:''}
   ${o.stache?`<path d="M-5,-33.4 C-2.6,-35 2.6,-35 5,-33.4 C2.6,-31.6 -2.6,-31.6 -5,-33.4 Z" fill="#8d8578"/>`:''}
   ${o.extra||''}</g>`;
}

function drawQueue(fed){
  const g=document.getElementById('queue'); if(!g) return;
  g.innerHTML=QUEUE.map(q=>{
    const served=q.i<fed;
    return fig({x:q.x,y:246,s:q.s,hat:q.kind,cls:served?'hold':'turn',
      dark:q.kind==='shawl'?'#5c4436':'#2b2620',
      extra:served?`<rect x="-4" y="-18" width="8" height="7" fill="#c9a86b" stroke="#14110e" stroke-width="1"/>`:''});
  }).join('');
  const t=document.getElementById('fedTxt');
  if(t) t.textContent=`fed today: ${fed} of 16 families`;
}

function scores(){
  let cm=-1,lb=-1,pr=2,ho=2,ask=0;
  TERMS.forEach(t=>{ if(picked.has(t.id)){cm+=t.cm;lb+=t.lb;pr+=t.pr;ho+=t.ho;ask+=t.ask;} });
  if(!picked.has('scale')) cm-=7;
  const wage=['w10','w20','w50'].find(w=>picked.has(w));
  if(!wage) lb-=8; else if(wage==='w10') lb-=3;
  // A strike costs a family six months of wages. The list has to be worth that.
  const thin = ask < 9;
  if(thin){ cm-=6; lb-=8; }
  return {cm,lb,pr,ho,wage,ask,thin};
}
function askNote(ask){
  return ask<9  ? ['thin','No family goes a winter without wages for this. They will not strike on it, and they will not forgive you for asking them to.']
       : ask<16 ? ['fair','Worth a winter. Not big enough to be called greedy.']
       : ask<23 ? ['heavy','A heavy list. Every paper in the East will print the length of it.']
       :          ['huge','This is everything at once. Nobody outside the valley will read it as bread.'];
}
function crowdState(){
  const sc=scores();
  const hot = picked.has('rec')||picked.has('w50')||picked.has('back');
  CROWD.forEach(p=>{
    const el=document.getElementById('sp'+p.i); if(!el) return;
    const mine = p.bloc==='cm'?sc.cm:sc.lb;
    let st='sit';
    if(mine<=-3) st = p.quirk<5?'leave':'sit';
    else if(mine<=0) st = p.quirk<2?'leave':'sit';
    else if(hot && mine>=6) st = p.quirk===6?'sit':'cheer';
    else if(mine>=9) st = p.quirk<3?'cheer':'sit';
    el.setAttribute('class', st==='cheer'?'sp cheer'
      : st==='leave'?('sp '+(p.x<330?'leaveL':'leaveR')) : 'sp');
  });
}
function drawTerms(){
  const wageRows=TERMS.filter(t=>t.g==='wage'), rest=TERMS.filter(t=>!t.g);
  const cell=t=>`<div class="tm ${picked.has(t.id)?'on':''}" data-id="${t.id}">
    <div class="bx">${picked.has(t.id)?'✕':''}</div>
    <div><b>${parse(t.t)}</b><i>${parse(t.d)}</i></div></div>`;
  document.getElementById('terms').innerHTML=
   `<div class="grp" style="grid-column:1/-1">Pay — choose one</div>${wageRows.map(cell).join('')}
    <div class="grp" style="grid-column:1/-1">Everything else — choose any</div>${rest.map(cell).join('')}`;
  document.querySelectorAll('.tm').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id, t=TERMS.find(x=>x.id===id);
    if(picked.has(id)){ picked.delete(id); whisper(t,false); }
    else{ if(t.g) TERMS.filter(x=>x.g===t.g).forEach(x=>picked.delete(x.id));
          picked.add(id); whisper(t,true); }
    drawTerms(); crowdState(); outFaces(); askBar(); askBar(); bindGloss();
  });
}
function whisper(t,on){
  const el=document.getElementById('wsp');
  if(!el) return;
  el.innerHTML = on
   ? `<b>In the hall</b><p>${parse(t.fl)}</p><b>Outside</b><p>${parse(t.ou)}</p>`
   : `<b>In the hall</b><p>You strike it off the list. ${parse(t.t)} is gone.</p>
      <b>Outside</b><p>Nobody outside this room will ever know you considered it.</p>`;
}
function askBar(){
  const el=document.getElementById('askline'); if(!el) return;
  const sc=scores(), [kind,note]=askNote(sc.ask);
  const pips=Math.min(10,Math.round(sc.ask/3));
  el.className='ask '+kind;
  el.innerHTML=`<b>Worth striking a winter for?</b>
    <span class="bar">${'▮'.repeat(pips)}${'▯'.repeat(Math.max(0,10-pips))}</span>
    <i>${note}</i>`;
}
function outFaces(){
  const sc=scores();
  const box=document.getElementById('wsf'); if(!box) return;
  box.innerHTML=[['pr',sc.pr],['ho',sc.ho]].map(([k,v])=>
   `<div class="wsface">${faceSvg(k,bandOf(v))}<span>${VOICE[k][0]}</span></div>`).join('');
}

function deliver(){
  if(!picked.size){ whisper({t:'nothing',fl:'You cannot hand them a blank sheet.',ou:'—'},true); return; }
  const sc=scores();
  const rx={
   cm:[bandMen(sc.cm), sc.thin?'"Six months without wages, for that? You could have got that by asking politely in March."'
      : sc.cm<=-3?'"You left the scale off. They will steal every raise back at the weigh house by August."'
      : sc.cm>=9?'"That is the man we elected. No more asking. Tell them what we are."'
      : sc.cm>=3?'"The scale is on the paper. Fine. Now do not let them talk you off it."'
      : '"It is thin, John. It is very thin."'],
   lb:[bandMen(sc.lb), sc.thin?'"My children go hungry until Christmas and this is the paper you hand them? No."'
      : sc.lb<=-3?'"You did not ask them for one cent we can live on. What do we eat?"'
      : sc.lb>=9?'"He put our name on the paper. Nobody in this country has done that for us."'
      : sc.lb>=3?'"Pay and an honest weight. It will feed people. We can stand on that."'
      : '"We hear you. We are not cheering."'],
   op:['COLD','"Mr. Baer has no comment on demands from persons with whom he has no relations."'],
   pr:[bandOf(sc.pr), sc.pr<=-4?'"This is not a strike for bread. It is a demand for power over an industry."'
      : sc.pr>=3?'"Reasonable men asking for reasonable things. We can print that."'
      : '"We shall wait and see what the operators say."'],
   ho:[bandOf(sc.ho), sc.ho<=-4?'"And who pays for all that? We do, in December, by the ton."'
      : sc.ho>=3?'"An honest weight for an honest day. Nobody could object to that."'
      : '"We only want to know whether there will be coal."']};
  const fx={FIELD:Math.round((sc.cm+sc.lb)/3) + (sc.thin?-24:0),
            COUNTRY:Math.round((sc.pr+sc.ho)*.9),
            STANDING:Math.round(sc.pr*1.3)};
  if(sc.thin) S.flags.THIN=true;
  apply(fx,rx,"The real 1902 demands were twenty per cent, an eight-hour day, payment by weight instead of by the car, and recognition. The operators refused to receive them at all. Baer would not meet Mitchell for five months.");
}

/* ═══ RELIEF LEDGER ═══ */
let BUDGET=12;
const LINES=[
 {id:'food',t:'Food',d:'Flour, beans, salt pork. The thing that decides whether a family can wait another week.',
  cm:1,lb:3,pr:1,ho:1},
 {id:'rent',t:'Rent for evicted families',d:'Most of these men rent from the company that fired them.',
  cm:2,lb:2,pr:2,ho:1},
 {id:'legal',t:'Lawyers for arrested men',d:'The [[coalandiron|Coal and Iron Police]] arrest on their own authority. Somebody has to answer it.',
  cm:3,lb:1,pr:1,ho:0},
 {id:'org',t:'Organizers in the field',d:'Men who ride between towns and keep the [[local|locals]] talking to each other.',
  cm:2,lb:2,pr:0,ho:0},
 {id:'bury',t:'Burial fund',d:'There will be funerals. There always are.',
  cm:2,lb:2,pr:3,ho:2}];
const alloc={food:5,rent:3,legal:1,org:3,bury:0};
const spent=()=>Object.values(alloc).reduce((a,b)=>a+b,0);
function fedCount(){ return Math.min(16, alloc.food*2 + alloc.rent); }
function ledScores(){
  let cm=0,lb=0,pr=0,ho=0;
  LINES.forEach(l=>{const n=alloc[l.id];
    cm+=n*l.cm*.42; lb+=n*l.lb*.42; pr+=n*l.pr*.42; ho+=n*l.ho*.42;});
  if(alloc.food<=2){lb-=8;cm-=3;}
  if(alloc.rent===0){cm-=4;lb-=4;pr-=2;}
  if(alloc.legal===0){cm-=4;}
  if(alloc.bury===0){pr-=3;ho-=2;}
  if(alloc.org===0){}
  return {cm:Math.round(cm-4),lb:Math.round(lb-4),pr:Math.round(pr-3),ho:Math.round(ho-3),
          org:alloc.org};
}
function drawLedger(){
  const box=document.getElementById('ledrows'); if(!box) return;
  box.innerHTML=LINES.map(l=>`<div class="row">
    <div class="nm"><b>${l.t}</b><i>${parse(l.d)}</i></div>
    <div class="pips">${'●'.repeat(alloc[l.id])}${'·'.repeat(Math.max(0,5-alloc[l.id]))}</div>
    <button onclick="bump('${l.id}',-1)" ${alloc[l.id]<=0?'disabled':''}>−</button>
    <button onclick="bump('${l.id}',1)" ${spent()>=BUDGET||alloc[l.id]>=5?'disabled':''}>+</button>
   </div>`).join('');
  const left=BUDGET-spent();
  document.getElementById('ledleft').textContent=left+' of '+BUDGET+' left';
  const btn=document.getElementById('ledgo'); if(btn) btn.disabled = left>0;
  drawQueue(fedCount());
  const sc=ledScores();
  const f=document.getElementById('wsf');
  if(f) f.innerHTML=[['pr',sc.pr],['ho',sc.ho]].map(([k,v])=>
    `<div class="wsface">${faceSvg(k,bandOf(v))}<span>${VOICE[k][0]}</span></div>`).join('');
  const w=document.getElementById('wsp');
  if(w){
    const notes=[];
    if(alloc.food<=2) notes.push('Families are being turned away from the line. Word of that travels faster than anything you say.');
    if(alloc.rent===0) notes.push('Nobody is covering rent. Furniture is going out onto the road this week.');
    if(alloc.legal===0) notes.push('Arrested men are sitting without a lawyer. The old hands are counting.');
    if(alloc.bury===0) notes.push('No burial money. When somebody dies, and somebody will, you will be passing a hat.');
    if(alloc.org===0) notes.push('No organizers riding out. The far locals stop hearing from you at all.');
    if(!notes.length) notes.push('Thin everywhere, but nothing is at zero. That is the best week you will have.');
    w.innerHTML=`<b>What this buys</b><p>${parse(notes.join(' '))}</p>
      <b>Fed today</b><p>${fedCount()} of 16 families at the station.</p>`;
  }
}
function bump(id,d){
  const n=alloc[id]+d;
  if(n<0||n>5) return;
  if(d>0 && spent()>=BUDGET) return;
  alloc[id]=n; drawLedger(); bindGloss();
}
function deliverLedger(){
  const sc=ledScores();
  const rx={
   cm:[bandOf(sc.cm), sc.cm<=-3?'"You left the arrested men to the county and the widows to a hat. We noticed."'
     : sc.cm>=6?'"He is running it like a man who intends to still be here in November."'
     : '"It will do for a week. Ask me again in a week."'],
   lb:[bandOf(sc.lb), sc.lb<=-3?'"There is no flour. My wife stood in that line for two hours and came home with nothing."'
     : sc.lb>=6?'"Nobody in this country has fed us before. He does it without being asked twice."'
     : '"We are eating. Barely. We are eating."'],
   op:['COLD','"Their relief fund cannot outlast our credit book. We need do nothing at all."'],
   pr:[bandOf(sc.pr), sc.pr<=-3?'"Disorder in the relief lines. The union cannot manage its own charity."'
     : sc.pr>=5?'"Whatever one thinks of the strike, the relief is being run soberly."'
     : '"The union claims its families are provided for."'],
   ho:[bandOf(sc.ho), sc.ho<=-3?'"Hungry men do desperate things and we are the ones who live near them."'
     : '"So long as it stays quiet up there."']};
  const fx={FIELD:Math.round((sc.cm+sc.lb)/4)+ (sc.org>=3?2:0),
            COUNTRY:Math.round((sc.pr+sc.ho)/2),
            STANDING:Math.round(sc.pr*.8), FUND:-3};
  apply(fx,rx,"Relief was funded almost entirely by working bituminous miners in other states, who were assessed a share of their own wages. It never covered everything, and Mitchell spent much of the summer deciding what to leave out.");
}

const PROVOCATIONS=[
{line:"I do not know this man. I have never dealt with him and I never will. He is here because you asked him, Mr. President. Not because he has any right to be.",
 stage:"He does not look at you once.",
 tones:[
  {t:'calm',say:"Mr. President, I am here because you asked me. I will answer any question you have."},
  {t:'wry', say:"Mr. Baer has not known me since May. In that time I have learned a great deal about him."},
  {t:'hot', say:"Since May I have been president of one hundred forty-seven thousand men. That is true whether you deal with me or not."}]},
{line:"There is nothing to arbitrate. We do not agree that a union exists in these coal fields. We will not deal with one, now or at any time.",
 stage:"He speaks only to the President.",
 tones:[
  {t:'calm',say:"We will accept whatever the President's board decides. I have nothing else to say."},
  {t:'wry', say:"This union that does not exist has kept 147,000 men out of work since May."},
  {t:'hot', say:"Then tell the President why they have obeyed it for five months with no pay."}]},
{line:"Mr. Mitchell is to blame for every crime in that region since May twelfth. Men have been killed. He belongs in a jail, not at this table, and you have seated him beside me.",
 stage:"He is looking at you now.",
 tones:[
  {t:'calm',say:"Nothing. You look at the President and let it sit there."},
  {t:'wry', say:"I have been in those towns every week since May. You have not been there once."},
  {t:'hot', say:"Name one. One man. One date. One court. You have had five months and you brought me a sentence."}]},

  {t:'wry', say:"You want the President to be your foreman. I would rather he was a judge."},
  {t:'hot', say:"Say that again slowly, so it goes in the record. You want the United States Army to run your mines."}]},
{line:"If there must be a board, no labor man sits on it. Not one. Not ever. You may appoint whom you like, Mr. President, but if you put a union man in that chair we will not come, and you may run the mines yourself!",
 stage:"He is on his feet. Roosevelt has not moved.",
 tones:[
  {t:'calm',say:"We will accept any board the President picks, on any terms he wants."},
  {t:'wry', say:"A soldier can judge us. A bishop can judge us. Only a man who has held a shovel cannot."},
  {t:'hot', say:"You pick the judges and the wages both? Then it is not arbitration. It is a verdict with a ceremony."}]}];
const TONE={
 calm:{band:'COLD', lab:'Calm',    st:5,  pr:2, ho:1, cm:-2, lb:-2, heat:0},
 wry :{band:'WRY',  lab:'Dry',     st:-3, pr:1, ho:0, cm:1,  lb:1,  heat:.10},
 hot :{band:'FURIOUS',lab:'Furious',st:0, pr:-3,ho:-2,cm:3,  lb:3,  heat:.22}};
const HOT_COST=[8,13,19,25,31];
let conf=0;

function baerHeat(){ return Math.min(1, 0.34 + conf*0.17 + S.hot*0.10); }
const EFF={
 calm:'<span class="up">Baer will be the only man in the room who lost his temper.</span> <span class="dn">Your own men will hear that you sat there and took it.</span>',
 wry :'<span class="up">Nobody can call this a shouting match.</span> <span class="dn">You still answered him, and Roosevelt heard you do it.</span>',
 hot :'<span class="up">Every miner in the valley will love you for it.</span> <span class="dn">And you will sound like one more hot-headed man from the coal fields.</span>'};
function confUI(){
  const p=PROVOCATIONS[conf];
  document.getElementById('who').textContent='Mr. Baer';
  document.getElementById('stat').textContent='In the room · '+(conf+1)+' of '+PROVOCATIONS.length;
  document.getElementById('art').innerHTML=
    scPortrait('baer','room','GEORGE F. BAER','PHILADELPHIA &amp; READING',{heat:baerHeat(),mood:'hot'});
  document.getElementById('say').innerHTML=md('*"'+p.line+'"*')+
    (p.stage?`<div style="margin-top:7px;font-size:11.5px;color:#8c1d15;">${p.stage}</div>`:'');
  document.getElementById('ui').innerHTML=
   p.tones.map((t,i)=>{
     const T=TONE[t.t];
     return `<button class="tone" onclick="conferee(${i})">
       <div class="hd">${faceSvg('you',T.band,t.t==='hot'?.55:0)}<span>${T.lab}</span></div>
       <div class="tx"><q>${t.say}</q><em>${EFF[t.t]}</em></div></button>`;}).join('') +
   `<div class="ledger">${
     conf>=4 ? 'Roosevelt has written something down. He did not write it while you were speaking.'
     : conf>=2 ? 'Roosevelt has said nothing all afternoon. He is watching the two of you.'
     : 'Roosevelt has said nothing yet. He is listening.'}</div>`;
}
function conferee(i){
  if(conf>=PROVOCATIONS.length) return;
  const p=PROVOCATIONS[conf], t=p.tones[i], T=TONE[t.t];
  prev={...S};
  if(t.t==='hot'){ S.STANDING=Math.max(0,S.STANDING-HOT_COST[Math.min(S.hot,4)]); S.hot++; }
  else { S.STANDING=Math.max(0,Math.min(100,S.STANDING+T.st)); if(t.t==='wry') S.wry++; }
  for(const [k,v] of [['cm',T.cm],['lb',T.lb],['pr',T.pr],['ho',T.ho]])
    S.rel[k]=Math.max(-20,Math.min(20,S.rel[k]+v));
  for(const k of ['cm','lb','pr','ho']) S.mood[k]=relBand(S.rel[k]);
  conf++;
  document.getElementById('art').innerHTML = t.t==='calm'
   ? scPortrait('tr','room','THEODORE ROOSEVELT','PRESIDENT OF THE UNITED STATES',{mood:'calm'})
   : scPortrait('you','room','JOHN MITCHELL','UNITED MINE WORKERS',
       {mood:t.t,heat:t.t==='hot'?.5:0});
  document.getElementById('say').innerHTML=md('*"'+t.say+'"*');
  document.getElementById('who').textContent = t.t==='calm' ? 'You say nothing' : 'You answer';
  hud();
  document.getElementById('ui').innerHTML = conf<PROVOCATIONS.length
   ? `<button class="go" onclick="confUI()">Baer speaks again →</button>`
   : `<button class="go" onclick="confEnd()">He stops speaking →</button>`;
}
function confEnd(){
  const temper=S.hot*2+S.wry;
  const rx = temper>=6 ? {
    cm:['CHEERING','He said it right back, in that house, to his face. Every town heard about it.'],
    lb:['CHEERING','He did not sit still and take it. Not once.'],
    op:['COLD','Two loud men yelling at each other. We were quite comfortable in that room.'],
    pr:['ANGRY','Both sides behaved badly. It is hard to tell them apart.'],
    ho:['ANGRY','They spent an afternoon shouting. We are still burning furniture.']}
   : temper===0 ? {
    cm:['ANGRY','He called you a murderer to your face and you said nothing.'],
    lb:['ANGRY','Five months, and in that room he had nothing to say.'],
    op:['COLD','Mitchell said almost nothing. It does not matter. We gave up nothing.'],
    pr:['CHEERING','Only one man in that room acted like a gentleman. It was not the one with the railroad.'],
    ho:['CHEERING','That is the man we would rather deal with.']}
   : {
    cm:['GRUDGING','He picked his moments. I would have picked more of them.'],
    lb:['GRUDGING','He spoke up when it mattered and stayed quiet when it did not.'],
    op:['COLD','Mitchell kept his temper. Unfortunate. It gives the President something to use.'],
    pr:['CHEERING','The difference between those two men was obvious, and every paper printed it.'],
    ho:['GRUDGING','He sounded like a man who wants this over.']};
  const fx = temper>=6?{COUNTRY:-14} : temper===0?{COUNTRY:14} : {COUNTRY:16};
  apply(fx,rx,"Roosevelt wrote afterwards that but for the dignity of his office he would have taken Baer by the seat of the trousers and thrown him out of the window. He also wrote that the only man in the room who behaved like a gentleman was the representative of the miners.");
}

const SLOTS=5;
const called=new Set();

function tally(){
  const t={WAGE:0,HOURS:0,WEIGHT:0,CHILD:0,DANGER:0,UNION:0};
  WITNESSES.forEach(w=>{ if(!called.has(w.id)) return;
    for(const k in w.g) t[k]+=w.g[k];
    if(w.risk===2){ t.WAGE-=1; } });
  if(S.flags.LEAD) t[S.flags.LEAD]+=3;
  t.OPS = 3;                       // the operators put on their own case, always
  t.WAGE=Math.max(0,t.WAGE-2); t.HOURS=Math.max(0,t.HOURS-1);
  return t;
}
function drawCase(){
  const box=document.getElementById('wits'); if(!box) return;
  box.innerHTML=WITNESSES.map(w=>{
    const on=called.has(w.id), full=called.size>=SLOTS&&!on;
    return `<div class="wit ${on?'on':''} ${full?'off':''}" data-id="${w.id}">
     <div class="bx">${on?'✕':''}</div>
     <div><span class="nm">${w.nm}</span><span class="rl">${parse(w.rl)}</span>
      <span class="ln">${w.ln}</span>
      ${w.says?`<span class="sy">${w.says.map(l=>`<span>${parse(l)}</span>`).join('')}</span>`:''}
      <span class="tags">
      ${Object.keys(w.g).map(k=>`<span class="tg">${FINDINGS.find(f=>f[0]===k)[1]}</span>`).join('')}
      ${w.risk?`<span class="tg risk">risk</span>`:''}</span>
      ${w.note?`<span class="ln" style="color:#8a5115">${w.note}</span>`:''}
      ${w.risk&&on?`<span class="ln" style="color:#8c1d15">${parse(w.riskLn)}</span>`:''}</div></div>`;}).join('');
  document.querySelectorAll('.wit').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    if(called.has(id)) called.delete(id);
    else if(called.size<SLOTS) called.add(id);
    drawCase(); drawFind(); bindGloss();
  });
  document.getElementById('slots').textContent=called.size+' of '+SLOTS+' days used';
  const g=document.getElementById('casego'); if(g) g.disabled=called.size<SLOTS;
}
function drawFind(){
  const t=tally(), box=document.getElementById('find'); if(!box) return;
  box.innerHTML=`<b>What the board has heard</b>`+FINDINGS.map(([k,lab])=>{
    const v=t[k], pips=Math.min(8,v);
    const st = k==='UNION' ? 'they will not' : v>=6?'proved':v>=3?'partly':'not yet';
    return `<div class="fr ${k==='UNION'||v<3?'no':''}"><div class="fl">${lab}</div>
     <div class="bar">${'▮'.repeat(pips)}${'▯'.repeat(8-pips)}</div>
     <div class="st">${st}</div></div>`;}).join('');
}
function submitCase(){
  const t=tally();
  S.flags.CASE=t;
  const strong=FINDINGS.filter(([k])=>k!=='UNION'&&t[k]>=6).length;
  const rx={
   cm:[strong>=3?'GRUDGING':'ANGRY', strong>=3?'He put the weigh house on the record. Twenty years we asked for that.'
      :'Five days, and half of them spent on things that will not put bread on a table.'],
   lb:[t.CHILD>=5?'GRUDGING':'COLD', t.CHILD>=5?'They put a boy of twelve in front of seven men in good coats. Let them look at him.'
      :'The board heard about coal. It did not hear about us.'],
   op:['COLD','Sentiment is not evidence. We shall put on figures.'],
   pr:[t.CHILD>=5?'CHEERING':'GRUDGING', t.CHILD>=5?'The testimony of the breaker boys is the most damning thing printed this year.'
      :'The miners made a careful case, and a dull one.'],
   ho:[t.DANGER>=5?'GRUDGING':'COLD', t.DANGER>=5?'We did not know they died at that rate. Nobody told us.'
      :'We only want to know what it does to the price.']};
  apply({},rx,"The commission heard 558 witnesses over three months. Clarence Darrow argued for the miners. The testimony of the breaker boys did not change the award at all, and it changed the country.");
}

/* ═══ THE AWARD ═══ */
function award(){
  // Recomputed, not read from S.flags.CASE: Darrow picks what to lead on a beat after
  // the witnesses are called, and tally() is where that choice is worth anything.
  const t=tally();
  const yes=(v)=>v>=6?2:v>=3?1:0;
  return {
   wage:yes(t.WAGE), hours:yes(t.HOURS), weight:yes(t.WEIGHT),
   concil:(yes(t.WAGE)+yes(t.HOURS))>=2?1:0, union:0,
   child:t.CHILD, danger:t.DANGER};
}
function awardDoc(){
  const a=award();
  const row=(k,v,txt)=>`<div class="it"><div class="k">${k}</div>
    <div class="v ${v===2?'yes':v===1?'part':'no'}">${txt}</div></div>`;
  return `<div class="doc"><h4>Award of the Commission</h4>
   <div class="dt">Washington · March 21, 1903</div>
   ${row('Wages', a.wage, a.wage===2?'up 10 per cent':a.wage===1?'up 5 per cent':'no increase')}
   ${row('The working day', a.hours, a.hours===2?'nine hours':a.hours===1?'nine hours, some trades':'unchanged')}
   ${row('Weighing the coal', a.weight, a.weight===2?'checkweighman allowed':a.weight===1?'weighed where practical':'unchanged')}
   ${row('A standing board for disputes', a.concil, a.concil?'granted':'refused')}
   ${row('Recognition of the union', 0, 'refused')}
   </div>`;
}

function awardUI(){
  const a=award(), good=a.wage+a.hours+a.weight+a.concil, thin = good<=2;
  return awardDoc()+
   `<button class="btn" style="margin-top:9px" onclick="signIt()"><b>Sign it.</b>
     <i class="pro">Why you should — ${thin
       ? 'It is thin, but both sides gave their word to accept whatever the board said, and your word is the only thing you have built in five months.'
       : 'It is more than any anthracite miner has ever been given, and it is written down where a company cannot quietly take it back.'}</i>
     <i class="con" style="margin-top:4px">Why you should not — ${thin
       ? 'Five months of hunger bought almost nothing, and every man in the valley can do that arithmetic.'
       : 'They still would not write the word union, and that is what the men actually struck for.'}</i></button>
    <button class="btn" onclick="refuseIt()"><b>Refuse it. Call them out again.</b>
     <i class="pro">Why you should — ${thin
       ? 'If this is all a board will give, then the board was never worth the wait, and the men deserve to hear you say so.'
       : 'You never agreed that seven strangers could price a man\'s life, and you could go back out tomorrow.'}</i>
     <i class="con" style="margin-top:4px">Why you should not — It is March. The men have been back at work and drawing wages since October. The relief fund is empty. Nobody needs coal in spring. And you promised in front of the President that you would accept whatever came.</i></button>`;
}

{act:2,scene:'room',tag:'August',who:'Somebody is talking',coal:4,

{act:2,scene:'guard',tag:'September',who:'The Guard',coal:3,
 text:"Governor Stone sends the whole Pennsylvania division into the fields. Roughly ten thousand soldiers, camped on the culm banks and drilling in the streets your men live on.\n\nNobody is shot. That is not the point of them. The point is that from today, every gathering of more than a few men happens in front of a rifle.\n\nThe strike does not break. It simply gets quieter, and the quiet costs you something you cannot get back.",

{act:2,scene:'funeral',tag:'Late September',who:'The funeral',coal:2,

       op:['COLD','"A demonstration dressed as a funeral. We shall describe it accurately."'],

{act:2,scene:'store',tag:'End of September',who:'End of Act Two',coal:1,
 text:"Nineteen weeks. The credit book is still shut. The Guard is still camped on the culm banks. Baer has not said your name once, in public or in private, since May.\n\nAnd in the cities the price of a ton of coal has started to climb in a way it has never climbed before.\n\nThat, and nothing you did, is what is about to save you.",
 type:'end',drain:2},

{act:3,scene:'city',tag:'October',who:'Thirty dollars a ton',coal:2,
 text:"Coal cost five dollars a ton in May. Now it costs thirty, when you can find any.\n\nSchools are closing. Hospitals are saving what they have. People take coal off railroad cars and the police look away. A wagon cannot finish its route without a crowd around it.\n\nYou did not plan any of this. You cannot control it. But it is the first thing in five months that has scared anyone important.\n\n**Your power was never the picket line. It is the cold.**",
 type:'go'},

{act:3,scene:'convention',tag:'The special convention',who:'Call out the soft coal?',coal:2,
 offer:['fahy',"Call them out. All of them. This week. Every factory in America goes cold and they give in before the snow. You have the votes in this room, John. All you have to do is not stop us."],
 text:"Three hundred men are here. Most came to vote yes.\n\nThey are asking you to spend the whole [[union]] on one throw.\n\nPull the [[bituminous|soft coal]] miners out too and almost every factory and train in America stops within a month. You would probably win before Christmas.\n\nYou would also break contracts your own union signed. Then any company can say a union's word means nothing. And a judge can order the men back with an [[injunction]]. That is how the Pullman strike ended in 1894, with its leader in jail.",
 type:'choice',
 record:"The UMW convention at Indianapolis in July 1902 considered a general strike and voted it down, with Mitchell arguing against it from the chair. Historians still argue about whether he was right.",

  {l:'Argue against it. We keep our contracts.',
   why:['A union that keeps its word is the only kind that survives in court. Break these contracts and you hand every judge in America the reason to break you.',
        'It is easy to have principles when you are not the one going hungry. Every man in that room knows it.'],
   fx:{FIELD:-12,COUNTRY:9,STANDING:11},flag:'HELD_CONTRACTS',
   rx:{cm:['GRUDGING','"A deal is a deal. I do not like it, and he is right."'],
       lb:['FURIOUS','"He will not spend their pay to save our children. He has never had to choose the other way."'],
       op:['COLD','"He just refused to use the only weapon he had. Give him nothing."'],
       pr:['CHEERING','"The union leader kept his word when breaking it would have won. That is worth printing."'],
       ho:['GRUDGING','"At least the factories will keep running."']}},
  {l:'Stand aside. Let the convention vote.',
   why:['It is their union and their hunger. You are one man with a chair, not a king. They have earned the right to decide.',

   fx:{FIELD:16,COUNTRY:-22,STANDING:-18},flag:'CONTRACTS_BROKEN',
   rx:{cm:['GRUDGING','"So it is on us now. Fine. It should have been all along."'],
       lb:['CHEERING','"Everything stops. Let them all feel it at once."'],
       op:['COLD','"They broke their contracts. Our lawyers will be in court Monday."'],
       pr:['FURIOUS','"A strike against the whole country. This is not about wages any more."'],

   fx:{FIELD:-18,COUNTRY:5,STANDING:-6},
   rx:{cm:['ANGRY','"He threatened us to stop us threatening them."'],
       lb:['FURIOUS','"So we can vote, as long as we vote his way."'],
       op:['COLD','"Their president rules by threat. Useful. It changes nothing."'],
       pr:['GRUDGING','"Mr. Mitchell won the vote, in a way he may come to regret."'],
       ho:['COLD','"So long as it ends."']}}]},

{act:3,scene:'convention',tag:'The back channel',who:'Mark Hanna',coal:2,
 offer:['hanna',"I want this fixed, Mr. Mitchell. I am not your friend. I am not their enemy. I am a man who wants this country to have coal before January.\n\nI can put money in your food fund through the [[ncf|Civic Federation]]. I can get you a meeting with men who will not answer your letters. I am not asking you for anything today. That is the point of me."],
 text:"He runs the Republican party. That is the operators' own party. As far as anyone can tell, he means it.\n\nYou have six weeks of food money left.",

  {l:'Take the money and the meetings.',

   rx:{cm:['COLD','"Money is money. I would rather not ask where it came from."'],
       lb:['ANGRY','"This month we eat because of the men who own the men who own us."'],
       op:['COLD','"Hanna has a soft heart. He will find that we do not."'],
       pr:['GRUDGING','"Sensible men on both sides are said to be talking."'],
       ho:['GRUDGING','"Somebody sensible is finally talking to somebody."']}},
  {l:'Refuse it. This union pays its own way.',
