        'Six weeks of food is six weeks of food. You just turned it down for people who never got to vote on it.'],
   fx:{FUND:-2,STANDING:-3},
   rx:{cm:['GRUDGING','"Clean hands. I hope they are worth what they cost us."'],
       lb:['ANGRY','"Clean hands are easy when you are the one eating."'],
       op:['COLD','"Proud and hungry. We can wait."'],
       pr:['COLD','"The union declines outside assistance."'],
       ho:['COLD','"And still nobody is talking."']}}]},

{act:3,scene:'convention',tag:'Late September',who:'The offer of a room',coal:1,
 offer:['hanna',"The President will meet both sides on October third. Now listen to me, because I know the man.\n\nHe does not want to send troops. Every president before him did, and he thinks they were wrong. He would like to come down on your side. He has said so, in a room, to me.\n\nBut he will not stake his office on one more angry man from the coal valleys. He has read about nothing but angry men all summer. He is sitting down with the two of you to work out which one is the reasonable one.\n\nThat is the whole game. Everything else comes after that."],
 text:"Five men and the President, in one room, for the first time in the history of the country.\n\nBaer will not shake your hand. Roosevelt watches him not do it.",
 type:'choice',
 record:"Roosevelt's October 3 conference was the first time a president mediated a strike rather than breaking one. He invited both sides personally, and afterwards wrote that his opinion of the two parties was formed largely in that room.",
 opts:[
  {l:'Go yourself.',
   why:['Nobody else can say yes in that room. A union that sends someone else to the White House is telling the country it is not serious.',
        'You will be judged on your face, in a chair, with no time to think, against a man who has been practicing since May.'],
   fx:{STANDING:4},flag:'WENT'},
  {l:'Send your three vice-presidents instead.',
   why:['Three men can talk it over. None of them can be pushed into saying the thing that ruins it.',
        'Roosevelt asked for you. He will notice. So will every paper that prints the guest list.'],
   fx:{STANDING:-12,COUNTRY:-6},flag:'SENT_DEPUTIES',
   rx:{cm:['COLD','Somebody went. It was not him.'],
       lb:['ANGRY','The one room that mattered, and he was not in it.'],
       op:['COLD','They sent clerks. We will treat them like clerks.'],
       pr:['ANGRY','The President invited Mr. Mitchell. Mr. Mitchell sent a delegation.'],
       ho:['COLD','Somebody had better be in that room.']}}]},

{act:3,scene:'convention',tag:'The night before',who:'Your own men',coal:1,
 offer:['fahy',"We are proud of you, John. A miner, in that house, at that table. Twenty years ago they hanged men like us and now the President has sent for you.\n\nSo say it. Say it to Baer's face, in front of the President, where it goes in the record. Tell him what he is. Every man in this valley has waited five months to hear somebody say it out loud.\n\nDo not go all that way and sit there polite."],
 text:"They mean it. They are proud, and they are right that somebody should say it.\n\nHanna told you something different this afternoon.\n\nOnly one of them is in the room tomorrow.",
 type:'go'},

{act:3,scene:'table',tag:'October 3',who:'The summons',coal:1,
 text:"The President summons both sides to Washington.\n\nHe is recovering from surgery after a trolley car struck his carriage in Pittsfield last month and killed the agent riding with him. He is in pain and he is in a temper.\n\nNo president has ever done this. Every previous one who touched a strike sent soldiers, and sent them against the union.\n\nHe is not doing this because you asked. He is doing it because eight million people are cold, and because when he read about you he decided you were the one worth risking it on.",
 type:'conf'},

{act:3,scene:'waiting',tag:'October 4–15',who:'You go home',coal:1,
 text:"The meeting ended. Nobody said whether it had gone well.\n\nYou took the train back to Indianapolis. You do not know if you won anything or lost everything.\n\nEvery morning you wait for a telegram. You expect to be called back in to help write the terms. You are the president of one hundred forty-seven thousand men. Surely somebody will send for you.\n\nNine days pass. Nobody does.",
 type:'go'},

{act:3,scene:'news',tag:'October 16',who:'The morning paper',coal:1,
 text:"**THE SCRANTON REPUBLICAN**\n*How it was done — in plain words*\n\n**1.** In May the miners stopped work. They wanted more pay and an honest weight.\n\n**2.** The owners would not speak to them. Not once, for five months.\n\n**3.** By October the cities had no coal. Schools closed.\n\n**4.** The President called both sides to Washington. No president had ever done that.\n\n**5.** The meeting failed. Nothing was agreed.\n\n**6.** So the President made a plan. He would send ten thousand soldiers to take the mines away from the owners and dig the coal himself.\n\n**7.** He never announced it. He told a general, and he let the right men hear about it.\n\n**8.** The owners gave in. They agreed to let a board decide the wages.\n\n**9.** The terms were written in New York, on J. P. Morgan's yacht. The man who wrote them went as a private citizen, so the government could deny it later.\n\n**10.** The owners said no union man could sit on that board.\n\n**11.** The President agreed. Then he gave the seat to a union man but called him an *eminent sociologist*. The owners said yes.\n\n**12.** The men go back Thursday. The board decides everything later.",
 type:'go'},

{act:3,scene:'react',tag:'The same morning',who:'You',coal:1,
 text:"He was going to take the mines. Off the owners. With the army.\n\nHe put a union man on that board. He made up a title for him, and they said yes, because they got to keep the word.\n\nAnd they wrote all of it on a boat. On J. P. Morgan's yacht, in New York harbour, while you sat in Indianapolis waiting for a telegram that was never coming.\n\nHe sat across a table from you for an entire afternoon and told you none of it.\n\nYou were never in the negotiation.\n\n**You were the evidence.**",
 type:'end'},

{act:4,scene:'return',tag:'October 23',who:'They go back',
 text:"At six in the morning the cages start running again.\\n\\n147,000 men go back down. There are no terms. No wage agreed. No hours agreed. Nothing in writing.\\n\\nThey go back because seven men in Washington will decide it later. And because there is no food left.\\n\\n**Look at the bar above.** The machine has started again. Nobody is angry now. Nobody is listening either.",
 type:'go'},

{act:4,scene:'hearing',tag:'November',who:'Seven men in good coats',
 text:"The [[commission]] meets in Scranton, then in Philadelphia. Seven men.\\n\\nA judge. An army engineer. A mine expert. A businessman. A bishop. A government man. And the union man Roosevelt slipped in by calling him a sociologist.\\n\\nThey will hear 558 witnesses. Clarence Darrow will argue your case.\\n\\nYou do not get a vote. You cannot decide anything.\\n\\n**The only power you have left is picking who they listen to.**",
 type:'go'},

{act:4,scene:'hearing',tag:'Your five days',who:'Building the case',
 text:"You get five hearing days. Nine people are willing to give [[testimony]].\\n\\nSome can prove a thing the board is able to fix — a wage, an hour, a [[checkweighman]] at the scale.\\n\\nSome can prove a thing the board cannot fix at all. The whole country will read it anyway.\\n\\nRead what each one will say. Then pick five.",
 type:'case'},

{act:4,scene:'darrow',tag:'February',who:'Clarence Darrow',
 offer:['darrow',"I close on Monday. I can take one thing and hold it up until they cannot look at anything else.\\n\\nTell me which one. I will make it the only thing they remember."],
 text:"He has read every page. He is very good. He only gets one ending.",
 type:'choice',
 record:"Darrow's closing argument for the miners ran for eight hours over two days. He called it the most satisfying work of his life to that point.",
 opts:[
  {l:'Lead on the weighing.',
   why:['It is the oldest wound and the one thing a board can actually fix with a rule.',
        'It is dull. No newspaper leads with a scale.'],
   fx:{},lead:'WEIGHT'},
  {l:'Lead on the pay.',
   why:['It is what the men struck for and it is what they will measure you by.',
        'The operators have five accountants ready and their books look good on paper.'],
   fx:{},lead:'WAGE'},
  {l:'Lead on the boys in the breakers.',
   why:['It is the truest thing in the record and it will be quoted for fifty years.',
        'The board cannot give you one cent for it.'],
   fx:{},lead:'CHILD'}]},

{act:4,scene:'award',tag:'March 21, 1903',who:'The award',
 text:"Seven men sign it. Both sides promised to accept it before they knew what it said.\n\nThe men went back in October because the food ran out. They have been paid since. Whatever you do now, you are asking people who are eating to stop eating again.\\n\\nHere is what five months bought. This is the [[award]].",
 type:'award'},

{act:4,scene:'day',tag:'Afterward',who:'Mitchell Day',
 text:"In the coal region they make October 29 a holiday. They call it Mitchell Day.\\n\\nYour picture hangs in kitchens across three counties. Men who cursed you in July name their sons after you.\\n\\nYou are thirty-three. You are the most admired labor leader in America.",
 type:'go'},

{act:4,scene:'you',tag:'What you could not see',who:'The part you missed',
 text:"You think you lost the big one. By your own measure you did. They would not write the word [[union|union]] on any paper.\\n\\nBut something happened in that room in October that had never happened before.\\n\\nA president stood **between** the two sides. Not behind one of them.\\n\\nEvery strike after this one is argued in the shape you made.\\n\\nNobody will ever tell you that.",
 type:'go'},

{act:4,scene:'you',tag:'1908',who:'And the rest of it',
 text:"You owned shares in coal companies while you ran the union.\\n\\nYou took money from a businessmen's group while you spoke for the men who worked for them.\\n\\nIt came out. The union later banned its officers from doing what you did.\\n\\nYou left in 1908. Your health was bad. So was your drinking. You died at forty-nine.\\n\\nThe holiday is still on the calendar.",
 type:'end'}
];

/* ═══ ENGINE ═══ Act I's, extended to dispatch Act II's ledger and Act III's
   portrait offers and conference, and to clamp SPLIT. */
let bi=0;
const art=document.getElementById('art'),sayEl=document.getElementById('say'),
 uiEl=document.getElementById('ui'),whoEl=document.getElementById('who'),
 statEl=document.getElementById('stat'),tagEl=document.getElementById('actTag'),
 ovl=document.getElementById('ovl'),cardsEl=document.getElementById('cards'),
 recEl=document.getElementById('record'),defEl=document.getElementById('def'),
 mastEl=document.getElementById('mast');

const ROMAN={1:'Act I',2:'Act II',3:'Act III',4:'Act IV'};
const MASTHEAD={1:1902,2:1902,3:1902,4:1903};
const SCENES={chain:scChain,walkout:scWalkout,hall:scHall,rail:scRail,
 store:scStore,eviction:scEviction,relief:scRelief,riot:scRiot,room:scRoom,
 guard:scGuard,funeral:scFuneral,
 city:scCity,convention:scConvention,table:scTrio,yacht:scYacht,
 waiting:scWaiting,news:scNews,
 react:()=>scPortrait('you','room','JOHN MITCHELL','READING THE PAPER',{mood:'wry'}),
 return:scReturn,hearing:scHearing,day:scDay,
 darrow:()=>scPortrait('darrow','hearing','CLARENCE DARROW','COUNSEL FOR THE MINE WORKERS',{}),
 you:()=>scPortrait('you','hearing','JOHN MITCHELL','UNITED MINE WORKERS',{}),
 award:()=>scPaper('THE AWARD','Seven men decide what five months were worth')};
/* scYacht and scConvention are unreached as written — the Corsair arrives through the
   newspaper and every convention beat carries a portrait. Both kept for a later act. */
function draw(scene,x){
  art.innerHTML = scene==='pump' ? scPump(!!x)
    : scene==='paper' ? scPaper(x.h,x.d)
    : SCENES[scene]();
  if(scene==='hall') crowdState();
  if(scene==='relief') drawQueue(fedCount());
}
function drawBeat(b){
  if(b.offer){ const p=PEOPLE[b.offer[0]];
    art.innerHTML=scPortrait(b.offer[0], b.scene==='convention'&&b.offer[0]==='fahy'?'hall':'office',
      p.nm.toUpperCase(), p.sub.replace(/&amp;/g,'&').toUpperCase()); }
  else draw(b.scene,false);
}
function bindGloss(){
  document.querySelectorAll('.gl').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const k=el.dataset.k, nm=GLOSS_NAME[k]||k;
    defEl.innerHTML=`<b>${nm}</b><br>${GLOSS[k]||''}`; defEl.style.display='block';});
}
function show(){
  const b=BEATS[bi];
  // Acts I and II script the coal beat by beat. In Act III production and demand decide it.
  if(b.act>=3) tickCoal();
  else if(b.coal!==undefined) setCoal(b.coal);
  if(b.drain) S.FUND=Math.max(0,S.FUND-b.drain);
  S.PRE = !!b.pre; S.act = b.act;
  drawBeat(b);
  tagEl.textContent=ROMAN[b.act]+' · '+b.tag;
  mastEl.textContent='The Coal Strike Chronicle · '+MASTHEAD[b.act];
  whoEl.textContent=b.who;
  const inAct=BEATS.filter(x=>x.act===b.act);
  statEl.textContent='Beat '+(inAct.indexOf(b)+1)+' / '+inAct.length;
  sayEl.innerHTML=md(b.text + (b.note && S.flags.TENTS ? '\n\n'+b.note : ''));
  defEl.style.display='none'; hud();
  const card = b.offer ? personCard(b.offer[0], parse(b.offer[1]).replace(/\n/g,'<br>'), 0) : '';
  if(b.type==='builder'){
    uiEl.innerHTML=`<div class="terms" id="terms"></div>
     <div id="askline"></div>
     <div class="wsbox"><div class="wstext" id="wsp"><b>Floor whispers</b>
       <p>Every line you add makes a friend in this hall and costs you one outside it.</p></div>
      <div class="wsfaces" id="wsf"></div></div>
     <button class="go" style="margin-top:9px" onclick="deliver()">Deliver the demands →</button>`;
    drawTerms(); crowdState(); outFaces();
  } else if(b.type==='ledger'){
    BUDGET = 12 - (S.flags.TENTS?2:0);
    while(spent()>BUDGET){
      const big=LINES.map(l=>l.id).sort((a,b2)=>alloc[b2]-alloc[a])[0];
      alloc[big]=Math.max(0,alloc[big]-1);
    }
    uiEl.innerHTML=`<div class="led"><div class="ledhead"><b>Relief ledger · this week</b>
      <span id="ledleft"></span></div><div id="ledrows"></div></div>
     <div class="wsbox"><div class="wstext" id="wsp"></div><div class="wsfaces" id="wsf"></div></div>
     <button class="go" id="ledgo" style="margin-top:9px" onclick="deliverLedger()">Pay it out →</button>`;
    drawLedger();
  } else if(b.type==='choice'){
    uiEl.innerHTML=card+b.opts.map((o,i)=>`<button class="btn" onclick="choose(${i})"><b>${parse(o.l)}</b>
      <i class="pro">Why you should — ${o.why[0]}</i>
      <i class="con" style="margin-top:4px">Why you should not — ${o.why[1]}</i></button>`).join('');
  } else if(b.type==='case'){
    uiEl.innerHTML=`<div class="wcount"><b>Hearing days</b><span id="slots"></span></div>
     <div id="wits"></div><div class="find" id="find"></div>
     <button class="go" id="casego" onclick="submitCase()">Call these five →</button>`;
    drawCase(); drawFind();
  } else if(b.type==='award'){
    uiEl.innerHTML=awardUI();
  } else if(b.type==='conf'){
    uiEl.innerHTML = S.STANDING<30
      ? `<button class="go" onclick="noConference()">Wait for the telegram →</button>`
      : `<button class="go" onclick="startConf()">Go to Washington →</button>`;
  } else if(b.type==='end'){
    uiEl.innerHTML=`<button class="go" onclick="finish()">Read the paper →</button>`;
  } else {
    uiEl.innerHTML=card+`<button class="go" onclick="advance()">Continue →</button>`;
  }
  bindGloss();
}
function bump_(k,v){ // one clamp rule for every meter
  if(k==='SPLIT') S.SPLIT=Math.max(-50,Math.min(50,S.SPLIT+v));
  else S[k]=Math.max(0,Math.min(k==='FIELD'?90:100,S[k]+v));
}
function choose(i){
  const o=BEATS[bi].opts[i];
  if(o.flag) S.flags[o.flag]=true;
  if(o.lead) S.flags.LEAD=o.lead;
  if(!o.rx){ // Act III's "Go yourself": a consequence with nobody to react to it
    prev={...S};
    for(const k in (o.fx||{})) bump_(k,o.fx[k]);
    hud(); advance(); return;
  }
  if(o.flag==='PUMPS_PULLED') draw('pump',true);
  setTimeout(()=>apply(o.fx,o.rx,BEATS[bi].record), o.flag==='PUMPS_PULLED'?2800:120);
}
function apply(fx,rx,record){
  prev={...S};
  for(const k in fx) bump_(k,fx[k]);
  for(const k in rx){
    if(k==='op'){ S.mood.op='COLD'; continue; }
    S.rel[k]=Math.max(-20,Math.min(20,S.rel[k]+REL_D[rx[k][0]]));
    S.mood[k]=relBand(S.rel[k]);
  }
  S.warms+=['cm','lb'].filter(k=>rx[k]&&rx[k][0]==='CHEERING').length;
  hud();
  const ord=ORDER.slice().sort((a,b)=>BAND[rx[a][0]].r-BAND[rx[b][0]].r);
  cardsEl.innerHTML=ord.map(k=>{
    const band=rx[k][0], hot=(band==='FURIOUS'||band==='ANGRY');
    return `<div class="card f-${band}"><div class="fc ${hot?'yell':''}">${faceSvg(k,band)}</div>
     <div class="bd"><div class="rw"><span class="nm">${VOICE[k][0]} — ${VOICE[k][1]}</span>
      <span class="bnd">${BAND[band].e} ${BAND[band].t.toUpperCase()}</span></div>
      <q>${rx[k][1]}</q></div></div>`;}).join('');
  recEl.innerHTML=record?`<b>The record</b><br>${record}`:'';
  ovl.style.display='block'; ovl.scrollTop=0;
}
function startConf(){
  conf=0; art.innerHTML=scTable('baer');
  whoEl.textContent='The Executive Mansion';
  confUI();
}
function dismiss(){ ovl.style.display='none'; advance(); }
function advance(){ bi=Math.min(bi+1,BEATS.length-1); show(); }

/* ═══ ACT BREAKS ═══ */
const ACT2=BEATS.findIndex(b=>b.act===2), ACT3=BEATS.findIndex(b=>b.act===3),
      ACT4=BEATS.findIndex(b=>b.act===4);
function beginActTwo(){ S.warms0=S.warms; bi=ACT2; show(); }
function beginActThree(){ bi=ACT3; show(); }
// The men going back is Act IV's opening event, not an initializer: the fields empty
// out and the country needs less coal in spring than it did in December.
function beginActFour(){ prev={...S}; S.FIELD=6; S.DEMAND=1.1; bi=ACT4; show(); }
function finish(){
  const a=BEATS[bi].act;
  a===4 ? finishActFour() : a===3 ? finishActThree() : a===2 ? finishActTwo() : finishActOne();
}
function endPaper(h,d,n,label,button){
  draw('paper',{h,d}); hud();
  whoEl.textContent='The Scranton Republican'; statEl.textContent=label;
  sayEl.innerHTML=md(n); defEl.style.display='none';
  uiEl.innerHTML=button;
}
const AGAIN=`<button class="go" onclick="location.reload()">Play again ↻</button>`;

function finishActOne(){
  let h,d,n,over=false;
  // over:true = the strike itself is finished. Those endings end the game; they do not
  // hand you a summer you no longer have any men for.
  if(S.flags.THIN && S.FIELD<52){h='NOT WORTH A WINTER';d='Districts vote to return on the operators\' terms';
   over=true;
   n="They went out for a raise they could have negotiated in March, and by the fourth week the arithmetic caught up with every kitchen in the valley.\n\nNobody betrayed you. They simply added it up.\n\n**Ending — the demands were too small.** A strike is not free. The men pay for it in advance, and the list has to be worth what it costs them.";}
  else if(S.FIELD<32){h='THE MEN GO BACK';d='Strike breaks in its sixth week';
   over=true;
   n="The line went before the summer did. Men returned in ones and twos and the owners took back only the ones they wanted.\n\n**Ending — the short strike.** The real strike held 163 days. This is what happened to almost every other strike of the era.";}
  else if(S.COUNTRY<25){h='THE COUNTRY TURNS';d='Editors call for troops in the coal fields';
   n="You kept your own men. You lost everybody else.\n\nWith the country against you there is no conference in October, because no president spends himself on a cause the public has already convicted.\n\n**Act One ends badly.**";}
  else if(S.warms>=4){h='MITCHELL CHEERED BY HIS OWN';d='Operators reprint his speeches in full';
   prev={...S};S.COUNTRY=Math.max(0,S.COUNTRY-15);S.STANDING=Math.max(0,S.STANDING-13);
   n="Everything you said this spring brought the hall to its feet.\n\nThe operators have printed all of it in a pamphlet, unedited, and mailed it to every newspaper east of Chicago. They did not need to change one word.\n\n**Act One ends.** The week you thought was your best was not.";}
  else if(S.flags.PUMPS_PULLED){h='WATER RISING IN THE WORKINGS';d='Eleven collieries below the second level';
   n="For the first time since May the owners are losing money.\n\nSo are the men. They do not know it yet.\n\n**Act One ends.**";}
  else {h='NO END IN SIGHT';d='Both sides settle in for the summer';
   n="You have won nothing.\n\nYou have lasted six weeks, which is longer than most.\n\n**Act One ends.**";}
  endPaper(h,d,n, over?'The strike is over':'End of Act I',
   over?AGAIN:`<button class="go" onclick="beginActTwo()">Begin Act II · The long summer →</button>`);
}

function finishActTwo(){
  let h,d,n,over=false;
  const warms=S.warms-S.warms0;
  if(S.FUND<=0){h='RELIEF FUND EXHAUSTED';d='Union announces no payments this week';
   over=true;
   n="There is no money. The line at the station forms anyway, out of habit, and then goes home.\n\n**Ending — the fund runs dry.** Men drift back through October in ones and twos. No award, no terms, no union.\n\n*This is what happened to most strikes of the era.*";}
  else if(S.FIELD<34){h='THE FIELDS BREAK';d='Collieries reopen at Nanticoke and Duryea';
   over=true;
   n="Enough men went back that the rest could see it happening.\n\n**Ending — the line gives.** You will spend the winter explaining, and there will be nothing to explain.";}
  else if(S.STANDING<30){h='NO FRIEND IN WASHINGTON';d='President said to regard both sides as equally at fault';
   n="You held the men. You lost your name.\n\nIn October the President will look at these coal fields and see two mobs. He will not spend himself on that, and there will be no conference.\n\n**Act Two ends with the door shut.**";}
  else if(warms>=4){h='MITCHELL CHEERED THROUGH THE VALLEY';d='Operators circulate his remarks to the eastern press';
   prev={...S};S.COUNTRY=Math.max(0,S.COUNTRY-14);S.STANDING=Math.max(0,S.STANDING-12);
   n="Every hall you entered this summer stood up.\n\nThe operators have been collecting it. They print it unedited, because unedited is what damages you.\n\n**Act Two ends.** The applause was the thing being used against you.";}
  else if(Math.abs(S.SPLIT)>20){h='TWO UNIONS IN ONE VALLEY';d='Districts said to be meeting separately';
   n=(S.SPLIT<0?"The Hazleton and Wilkes-Barre locals have stopped sending delegates. They will not say why, and everybody knows why."
     :"The old Scranton hands are holding their own meetings now and not inviting anyone.")+
   "\n\nThe strike holds. The union underneath it does not, quite.\n\n**Act Two ends divided.**";}
  else {h='NINETEEN WEEKS';d='Coal reaches fourteen dollars the ton in New York';
   n="You have won nothing and lost nothing.\n\nBut the price of coal in the cities has begun to move, and for the first time since May somebody outside this valley is paying attention.\n\n**Act Two ends.** Winter is doing the work you could not.";}
  endPaper(h,d,n, over?'The strike is over':'End of Act II',
   over?AGAIN:`<button class="go" onclick="beginActThree()">Begin Act III · The cold →</button>`);
}

function noConference(){
  S.flags.NO_CONFERENCE=true;
  endPaper('NO CONFERENCE','President declines to intervene in the coal fields',
   "The telegram never comes.\n\nRoosevelt read the summer the same way the country did. He saw two mobs in a valley. No president spends himself on a side the public has already blamed, and yours was blamed in July.\n\nThe cities freeze. The men go back in November with nothing. The operators take back only the ones they want.\n\n**Ending — the door shut before October.** Everything after the walkout came down to what people thought of you. You spent that in the summer.",
   'The strike is over', AGAIN);
}

function finishActThree(){
  let h,d,n,over=false;
  if(S.flags.CONTRACTS_BROKEN){
    over=true;
    h='INJUNCTION ISSUED';d='Federal court orders soft coal miners back to work';
    n="You won the strike in six weeks.\n\nThen a judge issued the order. Men who had never seen an anthracite mine went to jail for walking out to help you. The union spends the next several years in court. It does not come out the same size.\n\n**Ending — you won, and it cost the union.** The 1894 case was sitting there the whole time.";
  } else if(S.FUND<=0){
    over=true;
    h='RELIEF EXHAUSTED';d='No payments this week, union announces';
    n="The board will meet in November. Your families cannot wait that long.\n\nMen went back before any terms were written. So the board is now setting wages for people who already gave up.\n\n**Ending — you ran out of weeks.**";
  } else if(S.hot*2+S.wry>=6){
    h='BOTH SIDES REBUKED';d='President said to regard the parties as equally intemperate';
    n="You answered him. Every coal town heard about it. It felt like the only honest thing you did all year.\n\nRoosevelt walked out of that room saying both men were loud. The board still meets — the cold made that certain — but you will get the smaller version of everything. In the one room where they decided who was reasonable, you made it a question.\n\n**Act Three ends.** It was the truest thing you said, and it cost you the award.";
  } else if(S.hot+S.wry===0){
    h='THE COMMISSION IS APPOINTED';d='Miners accept arbitration without conditions';
    n="You sat there and let a man call you a murderer, and said nothing. It is the most useful thing you have ever done.\n\nRoosevelt writes later that only one man in that room acted like a gentleman. Your own men will read that line, and some of them will never forgive you for earning it.\n\n**Act Three ends.** Keeping quiet is not a virtue here. It is money, and you spent none of it.";
  } else {
    h='THE COMMISSION IS APPOINTED';d='Both sides accept arbitration; men return Thursday';
    n="It is arranged. Not settled. Arranged.\n\nSeven men will meet for four months and decide what your five months were worth. You will not be in the room for most of it.\n\n**Act Three ends.**";
  }
  endPaper(h,d,n, over?'The strike is over':'End of Act III',
   over?AGAIN:`<button class="go" onclick="beginActFour()">Begin Act IV · The board →</button>`);
}

function signIt(){
  const a=award();
  const good=a.wage+a.hours+a.weight+a.concil;
  const rx={
   cm:[good>=6?'GRUDGING':'ANGRY', good>=6?'It is on paper. It took five months and it is on paper.'
      :'Five months of hunger for that. I will not say it was worth it.'],
   lb:[a.wage===2?'GRUDGING':'ANGRY', a.wage===2?'Ten per cent is bread. We will take the bread.'
      :'We are paid almost what we were paid in April.'],
   op:['COLD','They did not get the word. That is the only line in it we care about.'],
   pr:['CHEERING','Both sides kept their promise and accepted the ruling. That is the news.'],
   ho:['GRUDGING','There is coal. That is all we ever wanted from any of you.']};
  apply({},rx,"The award of March 21, 1903 gave a ten per cent increase, a nine-hour day for most trades, a board of conciliation, and no recognition of the union. Mitchell's own left wing called it a sellout.");
}
function refuseIt(){
  S.flags.REFUSED=true;
  const rx={
   cm:['ANGRY','We are working. We are being paid. You want us to stop again, in April, over a piece of paper?'],
   lb:['FURIOUS','My children ate this month. You are asking me to take that back for a word.'],
   op:['COLD','He has broken his own agreement in front of the whole country. We need do nothing at all.'],
   pr:['FURIOUS','Mr. Mitchell gave his word to the President and to the nation. He has now withdrawn it.'],
   ho:['ANGRY','They promised. Everyone heard them promise.']};
  apply({FIELD:-4,STANDING:-40,COUNTRY:-34},rx,
   "Both sides agreed in advance to be bound by the award. No serious proposal to reject it was ever made. Mitchell campaigned for acceptance and the districts ratified it.");
}

function finishActFour(){
  if(S.flags.REFUSED) return refusedEnd();
  const NL='\n\n';
  const t=tally(), a=award();
  const legacy=t.CHILD+t.DANGER;
  let n="**The strike is over. This is what it did.**"+NL;
  n += a.wage===2 ? "The men got their ten per cent."+NL
     : a.wage===1 ? "The men got half of what they asked."+NL
     : "The men got no raise at all."+NL;
  n += a.weight===2 ? "And they got a man of their own at the scale, which is the thing they had wanted since before you were born."+NL
     : "The weigh house stayed exactly as it was."+NL;
  n += legacy>=8
     ? "The testimony you chose did something the award could not. The country read what a twelve-year-old does for a living, and it did not put the paper down. Pennsylvania tightened its child labour law in 1905. It is not in the award. It is in the record, and the record outlived everyone in it."+NL
     : "You built a careful case about wages and hours. It won what it could win. Nobody outside those counties remembers a word of it."+NL;
  n += "You never got [[recognition]]. No board was ever going to grant it. You knew that in May."+NL+
   "They did give you a [[conciliation|standing board]] to bring problems to. That is less than a contract and more than nothing."+NL+
   "**But a president stood between the owners and the workers, instead of behind the owners. Every strike since has been argued in that shape.**"+NL+
   "You were not in the room when it was decided. You were the reason it went the way it did.";
  endPaper('THE END OF IT','163 days · one winter · seven men', n, 'End of Act IV', AGAIN);
}

function refusedEnd(){
  const NL='\n\n';
  const n = "**You said no.**"+NL+
   "You told them the award was not enough and asked the districts to go out again."+NL+
   "Almost nobody came."+NL+
   "The men had been back at work since October. They were being paid. It was April, and nobody in America needs much coal in April, so there was nothing to squeeze. The relief fund had been empty since February."+NL+
   "And you had promised, in front of the President, in front of the whole country, that you would accept whatever the board decided. Everyone had heard you say it. That promise was the only thing you ever really owned, and you spent it in one afternoon."+NL+
   "The operators did not have to lift a finger. The men who did walk out were blacklisted by name."+NL+
   "**Ending — you refused the award.**"+NL+
   "*What actually happened:* both sides had agreed in advance to be bound by the ruling. Mitchell argued for accepting it, and the districts voted yes. The award was thin and he took it, because the alternative was this.";
  endPaper('MITCHELL REJECTS AWARD','Second strike called · districts do not answer', n, 'End of Act IV', AGAIN);
}

for(const k of ['cm','lb','pr','ho']) S.mood[k]=relBand(S.rel[k]);
show();
</script>
